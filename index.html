<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#070B14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>PriceIQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#070B14;color:#E8F0FE;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overscroll-behavior:none;-webkit-text-size-adjust:100%}
a,button,input,select,textarea{font-family:inherit}
input:focus,select:focus{outline:none;border-color:rgba(0,212,255,.5)!important}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#1C2A3A;border-radius:9px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:flex;flex-direction:column;min-height:100vh}
#nav{background:#0D1320;border-bottom:1px solid #1C2A3A;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:60px;flex-shrink:0}
.logo-box{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00D4FF,#0066FF);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-title{font-size:16px;font-weight:800;color:#E8F0FE;letter-spacing:-.4px}
.logo-sub{font-size:10px;color:#4A5568;font-weight:600;margin-top:-2px}
.nb{background:transparent;border:1px solid transparent!important;border-radius:9px;padding:6px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px;color:#4A5568;font-size:9px;font-weight:700;transition:all .15s}
.nb.on{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.28)!important;color:#00D4FF}
.page{padding:16px 16px 90px;max-width:700px;margin:0 auto;width:100%;animation:fadeIn .2s ease}
.hidden{display:none!important}
.card{background:#111827;border:1px solid #1C2A3A;border-radius:16px;padding:18px}
.card+.card{margin-top:12px}
.inp{width:100%;background:#070B14;border:1px solid #1C2A3A;border-radius:10px;padding:13px 14px;color:#E8F0FE;font-size:15px;display:block;-webkit-appearance:none;appearance:none}
.inp::placeholder{color:#4A5568}
select.inp{background-image:none;cursor:pointer}
.btn{border-radius:11px;padding:13px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;transition:opacity .15s;border:none}
.btn:active{opacity:.8}
.btn-p{background:linear-gradient(135deg,#00D4FF,#0066FF);color:#fff}
.btn-g{background:#0D1320;color:#8896AA;border:1px solid #1C2A3A!important}
.btn-d{background:rgba(255,77,109,.1);color:#FF4D6D;border:1px solid rgba(255,77,109,.2)!important}
.btn-sm{padding:9px 14px;font-size:13px;width:auto}
.btn:disabled,.btn[disabled]{opacity:.4;pointer-events:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid #1C2A3A;background:#0D1320;color:#8896AA;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:all .15s;cursor:pointer}
.chip.on{border-color:#00D4FF;background:rgba(0,212,255,.1);color:#00D4FF}
.tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px;display:inline-flex;align-items:center;flex-shrink:0}
.prog-wrap{background:#0D1320;border-radius:99px;height:6px;overflow:hidden;margin-top:10px}
.prog-fill{background:linear-gradient(135deg,#00D4FF,#0066FF);height:100%;border-radius:99px;width:0%;transition:width .4s ease}
.res-card{border-radius:18px;overflow:hidden;margin-bottom:14px;border:1px solid #1C2A3A;background:#111827}
.res-card.best{background:linear-gradient(135deg,rgba(0,212,255,.07),rgba(0,102,255,.04));border-color:rgba(0,212,255,.28);box-shadow:0 4px 24px rgba(0,212,255,.1)}
.res-card.recommended{border-color:rgba(255,184,0,.4);box-shadow:0 4px 24px rgba(255,184,0,.1)}
.res-body{padding:16px 18px}
.res-extra{border-top:1px solid #1C2A3A;padding:14px 18px;background:#070B14;display:none}
.res-extra.open{display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.pcell{background:#070B14;border-radius:10px;padding:9px 11px}
.plabel{color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.pval{color:#E8F0FE;font-size:13px;font-weight:700}
/* UNIFIED BUTTON ROW — all buttons same style, only color differs */
.arow{display:flex;gap:8px;margin-top:12px}
.arow-btn{flex:1;border-radius:10px;padding:11px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:1px solid #1C2A3A;background:#0D1320;color:#8896AA;cursor:pointer;transition:opacity .15s;font-family:inherit}
.arow-btn:active{opacity:.75}
.arow-btn.primary{background:linear-gradient(135deg,#00D4FF,#0066FF);color:#fff;border-color:transparent}
.arow-btn.danger{background:rgba(255,77,109,.1);color:#FF4D6D;border-color:rgba(255,77,109,.2)}
.arow-btn.icon-only{flex:0 0 auto;padding:11px 13px}
.ai-box{background:linear-gradient(135deg,rgba(0,212,255,.09),rgba(0,102,255,.05));border:1px solid rgba(0,212,255,.28);border-radius:18px;padding:20px;margin-bottom:18px}
.ai-best{background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.3);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.tog{width:50px;height:28px;border-radius:99px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.tog-dot{width:22px;height:22px;border-radius:99px;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tog.on .tog-dot{left:25px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.lbl{color:#8896AA;font-size:11px;font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.5);align-items:center;gap:8px;white-space:nowrap;display:none;animation:fadeIn .2s ease;max-width:90vw}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5)}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;z-index:201;background:#111827;border-radius:20px 20px 0 0;padding:20px 16px 40px;border-top:1px solid #1C2A3A}
.bs-item{width:100%;background:transparent;border:none;border-radius:10px;padding:14px 16px;color:#E8F0FE;font-size:15px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:600;cursor:pointer}
.bs-item:active{background:rgba(255,255,255,.05)}
.hcard{background:#111827;border:1px solid #1C2A3A;border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.conf-high{color:#00E5A0}.conf-med{color:#FFB800}.conf-low{color:#FF4D6D}
.rate-bar{background:#111827;border:1px solid #1C2A3A;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </div>
      <div>
        <div class="logo-title">PriceIQ</div>
        <div class="logo-sub" id="nav-rate-sub">Comparador com IA</div>
      </div>
    </div>
    <div style="display:flex;gap:2px">
      <button class="nb on" id="nb-home" onclick="nav('home')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Início
      </button>
      <button class="nb" id="nb-suppliers" onclick="nav('suppliers')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Lojas
      </button>
      <button class="nb" id="nb-history" onclick="nav('history')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 0 .5-4M3 3v5h5"/></svg>
        Histórico
      </button>
      <button class="nb" id="nb-settings" onclick="nav('settings')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Config
      </button>
    </div>
  </nav>
  <div id="page-home" class="page"></div>
  <div id="page-suppliers" class="page hidden"></div>
  <div id="page-history" class="page hidden"></div>
  <div id="page-settings" class="page hidden"></div>
  <div id="page-results" class="page hidden"></div>
</div>
<div id="toast"></div>
<div id="overlay" class="overlay hidden" onclick="closeSheet()"></div>
<div id="sheet" class="bottom-sheet hidden"></div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════════════════
const LS={
  g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

// ══════════════════════════════════════════════════════
// DEFAULT DATA
// ══════════════════════════════════════════════════════
const DEF_SUP=[
  {id:"ml",  name:"Mercado Livre",site:"mercadolivre.com.br", url:"https://lista.mercadolivre.com.br/{q}",              type:"Nacional",     country:"Brasil",cur:"BRL",on:true, note:"Maior marketplace do Brasil"},
  {id:"amz", name:"Amazon BR",   site:"amazon.com.br",        url:"https://www.amazon.com.br/s?k={q}",                   type:"Nacional",     country:"Brasil",cur:"BRL",on:true, note:"Amazon Brasil"},
  {id:"shp", name:"Shopee",      site:"shopee.com.br",        url:"https://shopee.com.br/search?keyword={q}",            type:"Nacional",     country:"Brasil",cur:"BRL",on:true, note:"Crescimento acelerado"},
  {id:"mag", name:"Magalu",      site:"magazineluiza.com.br", url:"https://www.magazineluiza.com.br/busca/{q}/",          type:"Nacional",     country:"Brasil",cur:"BRL",on:true, note:"Grande varejista"},
  {id:"ali", name:"AliExpress",  site:"aliexpress.com",       url:"https://www.aliexpress.com/wholesale?SearchText={q}", type:"Internacional",country:"China", cur:"USD",on:true, note:"Varejo chinês"},
  {id:"alib",name:"Alibaba",     site:"alibaba.com",          url:"https://www.alibaba.com/trade/search?SearchText={q}", type:"Internacional",country:"China", cur:"USD",on:false,note:"Atacado B2B"},
  {id:"amzu",name:"Amazon USA",  site:"amazon.com",           url:"https://www.amazon.com/s?k={q}",                      type:"Internacional",country:"EUA",  cur:"USD",on:false,note:"Amazon americana"},
];
const DEF_SET={usd:5.10,eur:5.55,cny:0.70,freight:25,margin:30,
  apiKey:"",geminiModel:"gemini-2.5-flash-lite",rateSource:"",rateTime:"",rateTimestamp:0};

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
const ST={
  suppliers:LS.g("piq_sup",DEF_SUP),
  settings: LS.g("piq_set",DEF_SET),
  history:  LS.g("piq_hist",[]),
  saved:    LS.g("piq_saved",[]),
  query:"",selIds:[],results:[],meta:null,insight:null,
  searching:false,aiLoading:false,
  progDone:0,progTotal:0,progCur:"",
  expandId:null,view:"home",
  sfMode:null,sfId:null,sfData:null,
  rateLoading:false,
  searchErrors:[]
};

function persist(){
  LS.s("piq_sup",ST.suppliers);
  LS.s("piq_set",ST.settings);
  LS.s("piq_hist",ST.history);
  LS.s("piq_saved",ST.saved);
}

// ══════════════════════════════════════════════════════
// MIGRAÇÃO — garante que todos os fornecedores tenham url/site válidos
// (versões antigas podem ter salvo sem o campo url no localStorage)
// ══════════════════════════════════════════════════════
function migrateSuppliers(){
  const KNOWN_URLS={
    "mercadolivre.com.br":"https://lista.mercadolivre.com.br/{q}",
    "amazon.com.br":"https://www.amazon.com.br/s?k={q}",
    "amazon.com":"https://www.amazon.com/s?k={q}",
    "shopee.com.br":"https://shopee.com.br/search?keyword={q}",
    "magazineluiza.com.br":"https://www.magazineluiza.com.br/busca/{q}/",
    "aliexpress.com":"https://www.aliexpress.com/wholesale?SearchText={q}",
    "alibaba.com":"https://www.alibaba.com/trade/search?SearchText={q}",
    "americanas.com.br":"https://www.americanas.com.br/busca/{q}",
    "submarino.com.br":"https://www.submarino.com.br/busca/{q}",
    "casasbahia.com.br":"https://www.casasbahia.com.br/busca/{q}",
  };
  let changed=false;
  ST.suppliers=(ST.suppliers||[]).filter(s=>s&&typeof s==="object").map(s=>{
    const out={...s};
    if(!out.id)out.id="sup"+Date.now()+Math.random().toString(36).slice(2,6);
    if(!out.name)out.name=out.site||"Fornecedor";
    if(!out.cur)out.cur="BRL";
    if(!out.country)out.country="Brasil";
    if(!out.type)out.type="Nacional";
    if(typeof out.on!=="boolean")out.on=true;
    // Campo crítico: site
    if(!out.site&&out.url){
      const m=String(out.url).match(/https?:\/\/([^\/]+)/);
      if(m)out.site=m[1].replace(/^www\./,"");
    }
    if(!out.site)out.site="";
    // Campo crítico: url
    if(!out.url||typeof out.url!=="string"||!out.url.includes("{q}")){
      const siteKey=String(out.site||"").replace(/^www\./,"").toLowerCase();
      out.url=KNOWN_URLS[siteKey]||(out.site?`https://${out.site}/search?q={q}`:"");
      changed=true;
    }
    return out;
  }).filter(s=>s.site||s.url);
  if(changed)persist();
}
migrateSuppliers();

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmt(n){return typeof n==="number"?n.toFixed(2):String(n||"0.00")}
function fmtDate(iso){try{return new Date(iso).toLocaleString("pt-BR")}catch{return iso||""}}

// ══════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════
let _toastT=null;
function toast(msg,type="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.style.background=type==="ok"?"#00C48C":"#FF4D6D";
  el.style.color="#fff";el.style.display="flex";
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>{el.style.display="none"},3500);
}

// ══════════════════════════════════════════════════════
// BOTTOM SHEET
// ══════════════════════════════════════════════════════
function openSheet(html){
  document.getElementById("sheet").innerHTML=html;
  document.getElementById("sheet").classList.remove("hidden");
  document.getElementById("overlay").classList.remove("hidden");
}
function closeSheet(){
  document.getElementById("sheet").classList.add("hidden");
  document.getElementById("overlay").classList.add("hidden");
}

// ══════════════════════════════════════════════════════
// NAV
// ══════════════════════════════════════════════════════
function nav(v){
  ["home","suppliers","history","settings","results"].forEach(p=>{
    document.getElementById("page-"+p).classList.toggle("hidden",p!==v);
  });
  ["home","suppliers","history","settings"].forEach(p=>{
    const b=document.getElementById("nb-"+p);
    if(b)b.className="nb"+(p===v?" on":"");
  });
  ST.view=v;
  if(v==="home")      renderHome();
  if(v==="suppliers") renderSuppliers();
  if(v==="history")   renderHistory();
  if(v==="settings")  renderSettings();
  if(v==="results")   renderResults();
}

// ══════════════════════════════════════════════════════
// ICONS
// ══════════════════════════════════════════════════════
const ico={
  search:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  zap:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
  pkg:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
  save:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
  share:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
  link:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
  eye:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
  trash:`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>`,

function getGeminiApiKey(){
  return String(ST.settings.apiKey||LS.g("piq_gemini_key","")||"").trim();
}
function getGeminiModel(){
  return String(ST.settings.geminiModel||"gemini-2.5-flash-lite").trim();
}
async function callGemini(prompt,maxTokens=2500,useSearch=true){
  const apiKey=getGeminiApiKey();
  if(!apiKey){
    throw new Error("Gemini API Key não configurada. Vá em Configurações, cole a chave e salve.");
  }
  const model=getGeminiModel();
  const body={
    contents:[{role:"user",parts:[{text:prompt}]}],
    generationConfig:{temperature:0.1,maxOutputTokens:maxTokens}
  };
  if(useSearch) body.tools=[{google_search:{}}];
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(apiKey),{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    throw new Error(d?.error?.message||("Erro Gemini HTTP "+r.status));
  }
  const out=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("\n").trim();
  if(!out){
    const reason=d.candidates?.[0]?.finishReason||"resposta vazia";
    throw new Error("Gemini respondeu vazio: "+reason);
  }
  return out;
}
// Mantém o nome antigo para não quebrar o restante do app.
async function callClaude(prompt,maxTokens=2500){
  return callGemini(prompt,maxTokens,true);
}
async function testGeminiAPI(){
  try{
    const raw=await callGemini('Responda apenas este JSON: {"ok":true,"message":"Gemini funcionando"}',300,false);
    const p=parseJson(raw);
    if(p&&p.ok){toast("Gemini funcionando!","ok");return true;}
    toast("Gemini respondeu, mas não retornou JSON esperado.","err");
    return false;
  }catch(e){
    toast("Erro Gemini: "+(e.message||e),"err");
    return false;
  }
}

function parseJson(raw){
  if(!raw)return null;
  let m=raw.match(/```json\s*([\s\S]*?)```/i);
  if(m){try{return JSON.parse(m[1].trim())}catch{}}
  m=raw.match(/```\s*([\s\S]*?)```/);
  if(m){try{return JSON.parse(m[1].trim())}catch{}}
  const s=raw.indexOf("{"),e=raw.lastIndexOf("}");
  if(s>-1&&e>s){
    try{return JSON.parse(raw.slice(s,e+1))}catch{}
    try{return JSON.parse(raw.slice(s,e+1).replace(/,\s*([}\]])/g,"$1"))}catch{}
  }
  return null;
}

const RATE_TTL=3600000; // 1 hora em ms

async function fetchLiveRates(force=false){
  const s=ST.settings;
  const age=Date.now()-(s.rateTimestamp||0);
  const hasCache=s.usd>0&&s.cny>0&&s.eur>0&&s.rateTimestamp>0;

  // Atualiza somente de hora em hora, a não ser que o usuário force.
  if(!force&&hasCache&&age<RATE_TTL){
    updateNavRateSub();
    return {usd:s.usd,eur:s.eur,cny:s.cny,source:s.rateSource,time:s.rateTime,fromCache:true};
  }

  ST.rateLoading=true;
  updateNavRateSub();

  // FONTE PRIMÁRIA — AwesomeAPI.com.br (API brasileira, cotação em BRL, gratuita, sem chave)
  try{
    const r=await fetch("https://economia.awesomeapi.com.br/json/last/USD-BRL,EUR-BRL,CNY-BRL",{cache:"no-store"});
    const d=await r.json();
    if(r.ok&&d&&d["USDBRL"]&&d["EURBRL"]&&d["CNYBRL"]){
      const usd=parseFloat(d["USDBRL"].bid)||0;
      const eur=parseFloat(d["EURBRL"].bid)||0;
      const cny=parseFloat(d["CNYBRL"].bid)||0;
      if(usd>1&&eur>1&&cny>0){
        const now=Date.now();
        const timeStr=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
        ST.settings={...ST.settings,
          usd:parseFloat(usd.toFixed(4)),
          cny:parseFloat(cny.toFixed(4)),
          eur:parseFloat(eur.toFixed(4)),
          rateSource:"AwesomeAPI",
          rateTime:timeStr,
          rateTimestamp:now
        };
        persist();
        ST.rateLoading=false;
        updateNavRateSub();
        return{usd:ST.settings.usd,cny:ST.settings.cny,eur:ST.settings.eur,source:"AwesomeAPI",time:timeStr,fromCache:false};
      }
    }
    throw new Error("resposta inválida da AwesomeAPI");
  }catch(e){
    console.warn("[PriceIQ rates primary]",e.message);
  }

  // FONTE SECUNDÁRIA — ExchangeRate API (fallback gratuito)
  try{
    const r=await fetch("https://open.er-api.com/v6/latest/BRL",{cache:"no-store"});
    const d=await r.json();
    const rates=d&&d.rates?d.rates:null;
    if(r.ok&&rates&&rates.USD>0&&rates.CNY>0&&rates.EUR>0){
      const now=Date.now();
      const usd=1/Number(rates.USD);
      const cny=1/Number(rates.CNY);
      const eur=1/Number(rates.EUR);
      const timeStr=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      ST.settings={...ST.settings,
        usd:parseFloat(usd.toFixed(4)),
        cny:parseFloat(cny.toFixed(4)),
        eur:parseFloat(eur.toFixed(4)),
        rateSource:"ExchangeRate",
        rateTime:timeStr,
        rateTimestamp:now
      };
      persist();
      ST.rateLoading=false;
      updateNavRateSub();
      return{usd:ST.settings.usd,cny:ST.settings.cny,eur:ST.settings.eur,source:"ExchangeRate",time:timeStr,fromCache:false};
    }
    throw new Error("resposta inválida da ExchangeRate");
  }catch(e){
    console.error("[PriceIQ rates fallback]",e.message);
  }

  ST.rateLoading=false;
  updateNavRateSub();

  // Último recurso — mantém última cotação salva/manual.
  if(hasCache){
    return{usd:s.usd,cny:s.cny,eur:s.eur,source:(s.rateSource||"cotação salva")+" (cache)",time:s.rateTime,fromCache:true,stale:true};
  }
  return{usd:s.usd||5.10,cny:s.cny||0.70,eur:s.eur||5.55,source:"manual",time:"—",fromCache:true,stale:true};
}

function updateNavRateSub(){
  const el=document.getElementById("nav-rate-sub");
  if(!el)return;
  const s=ST.settings;
  if(ST.rateLoading){el.textContent="Atualizando cotações…";return;}
  if(s.rateTime&&s.usd>0){
    el.textContent=`USD ${fmt(s.usd)} · ${s.rateTime}`;
  } else {
    el.textContent="Comparador com IA";
  }
}

function rateAge(){
  const ts=ST.settings.rateTimestamp||0;
  if(!ts)return"nunca atualizado";
  const mins=Math.floor((Date.now()-ts)/60000);
  if(mins<2)return"agora mesmo";
  if(mins<60)return`${mins} min atrás`;
  return`${Math.floor(mins/60)}h atrás`;
}

// TAREFA 3 — INTERPRETAÇÃO INTELIGENTE DO PRODUTO
// Extrai palavras obrigatórias, opcionais e termos de exclusão dinâmicos
// ══════════════════════════════════════════════════════
function interpretQuery(rawQuery){
  const q=rawQuery.toLowerCase().trim();

  // Detecta se o usuário está buscando um acessório/item secundário
  const accessoryKeywords=["capinha","capa","case","cover","película","pelicula","protetor","cabo","carregador","charger","suporte","adaptador","fone","headset","earphone","bateria","película","película","película"];
  const isSearchingAccessory=accessoryKeywords.some(kw=>q.includes(kw));

  // Termos de exclusão apenas quando o usuário NÃO está buscando acessório
  let exclusionTerms=[];
  if(!isSearchingAccessory){
    exclusionTerms=["capinha","capa case","película","pelicula","protetor de tela",
      "carregador","cabo usb","adaptador","fone de ouvido","bateria extra",
      "suporte","compatível com","similar","réplica","replica","genérico","generico",
      "para iphone","para samsung","para celular"];
  }

  // Extrai especificações numéricas e palavras-chave importantes
  const specPatterns=[
    /\b\d+\s*gb\b/gi,/\b\d+\s*tb\b/gi,/\b\d+\s*mb\b/gi,
    /\b\d+"\b/gi,/\b\d+\s*polegadas?\b/gi,/\b\d+\s*mm\b/gi,
    /\bi[3579]\b/gi,/\bryzem?\s*\d+\b/gi,
    /\b\d+x\d+\b/gi
  ];
  const specs=[];
  specPatterns.forEach(p=>{const m=q.match(p);if(m)specs.push(...m.map(s=>s.trim()))});

  return{
    original:rawQuery,
    normalized:rawQuery.trim(),
    isSearchingAccessory,
    exclusionTerms,
    specs,
    mustContain:rawQuery.trim().split(/\s+/).filter(w=>w.length>2)
  };
}

// ══════════════════════════════════════════════════════
// VALIDAÇÃO — apenas rejeições críticas
// ══════════════════════════════════════════════════════
function isUnwantedAccessory(name,queryMeta){
  if(queryMeta.isSearchingAccessory)return false;
  const n=(name||"").toLowerCase();
  return queryMeta.exclusionTerms.some(t=>n.includes(t));
}

// Busca conteúdo real de uma URL via Jina Reader (gratuito, sem chave)
async function fetchPageViaJina(url){
  const endpoint="https://r.jina.ai/"+url;
  const r=await fetch(endpoint,{
    headers:{"Accept":"text/plain","X-Return-Format":"text","X-Timeout":"15"},
    signal:AbortSignal.timeout(20000)
  });
  if(!r.ok)throw new Error("Jina HTTP "+r.status);
  const txt=await r.text();
  // Retorna os primeiros 5000 chars — suficiente para ver lista de resultados
  return txt.slice(0,5000);
}

// Converte resposta bruta do Gemini em objeto de resultado padronizado
function buildResult(p,product,sup,set,queryMeta,fallbackSearchUrl){
  if(!p||!p.found)return{found:false};
  const price=parseFloat(p.price)||0;
  if(price<=0||price>5000000)return{found:false,reason:"preço inválido"};
  if(!p.productName)return{found:false,reason:"nome ausente"};
  if(isUnwantedAccessory(p.productName,queryMeta))return{found:false,reason:"acessório indesejado"};

  // Campos seguros do fornecedor
  const safeSup=sup||{};
  const supSite=String(safeSup.site||"").trim();
  const supName=String(safeSup.name||supSite||"Fornecedor").trim();
  const supCur=String(safeSup.cur||"BRL").trim().toUpperCase();
  const supId=String(safeSup.id||"sup"+Date.now()).trim();

  // Link: usa o retornado se contiver o domínio do fornecedor; senão usa URL de busca
  let link=String(p.link||"");
  const siteNoWww=supSite.replace(/^www\./,"");
  const linkValid=link.startsWith("http")&&supSite&&(link.includes(supSite)||link.includes(siteNoWww));
  if(!linkValid)link=fallbackSearchUrl||link||"";

  const freight=parseFloat(p.freight)||0;
  const priceMin=parseFloat(p.priceMin)||price;
  const priceMax=parseFloat(p.priceMax)||price;
  const total=price+freight;
  const cur=String(p.currency||supCur).toUpperCase();
  const rateUsed=cur==="USD"?set.usd:cur==="EUR"?set.eur:cur==="CNY"?set.cny:1;
  const brl=parseFloat((total*rateUsed).toFixed(2));
  const priceBRL=parseFloat((price*rateUsed).toFixed(2));
  const freightBRL=parseFloat((freight*rateUsed).toFixed(2));
  const minBrl=parseFloat((priceMin*rateUsed).toFixed(2));
  const maxBrl=parseFloat((priceMax*rateUsed).toFixed(2));
  const ratePair=cur==="BRL"?"BRL":cur+"/BRL";

  return{
    found:true,
    id:"r"+Date.now()+Math.random().toString(36).slice(2,6),
    productName:String(p.productName||product).slice(0,150),
    supplier:supName,supId:supId,
    sellerName:String(p.sellerName||""),
    sellerRating:String(p.sellerRating||""),
    sellerReviews:parseInt(p.sellerReviews)||0,
    productRating:String(p.productRating||p.rating||""),
    productReviews:parseInt(p.productReviews||p.reviews)||0,
    price,priceMin,priceMax,
    currency:cur,originalCurrency:cur,
    exchangePair:ratePair,exchangeRateUsed:rateUsed,
    priceBRL,
    rateSource:set.rateSource||"manual",rateTime:set.rateTime||"",rateTimestamp:set.rateTimestamp||0,
    freight,total,brl,freightBRL,
    priceMinBrl:minBrl,priceMaxBrl:maxBrl,
    freeShip:["grátis confirmado","grátis","free"].includes(String(p.freightNote||"").toLowerCase()),
    freightNote:String(p.freightNote||"não encontrado"),
    freightSourceText:String(p.freightSourceText||""),
    needsManualFreightCheck:!p.freightNote||p.freightNote==="não encontrado",
    link,
    available:p.available!==false,
    sellers:parseInt(p.sellers)||1,
    priceType:String(p.priceType||"real"),
    priceSourceText:String(p.priceSourceText||""),
    exactMatchScore:parseInt(p.exactMatchScore)||75,
    priceConfidence:parseInt(p.priceConfidence)||75,
    totalConfidence:parseInt(p.totalConfidence)||75,
    warnings:Array.isArray(p.warnings)?p.warnings:[],
    note:String(p.note||""),
    ts:new Date().toISOString()
  };
}

// Busca um fornecedor: Jina Reader → Gemini parse (primário) | Gemini grounding (fallback)

  "sellers": 1,
  "freight": 0.00,
  "freightNote": "grátis confirmado|real encontrado|não encontrado",
  "freightSourceText": "trecho que confirma o frete ou ''",
  "needsManualFreightCheck": false,
  "priceType": "real|a_partir_de|faixa|não_encontrado",
  "priceSourceText": "trecho curto que prova o preço",
  "isExactProduct": true,
  "exactMatchScore": 85,
  "priceConfidence": 85,
  "totalConfidence": 85,
  "warnings": [],
  "note": ""
}

REGRAS ABSOLUTAS:
1. price: número puro extraído da página (ex: 1299.90). NÃO invente.
2. Se encontrar múltiplos vendedores: price=média, priceMin=menor, priceMax=maior, sellers=quantidade
3. freight: valor real da página. Se "frete grátis" → 0 e freightNote:"grátis confirmado". Se não aparecer → freight:0, freightNote:"não encontrado", needsManualFreightCheck:true
4. link: URL REAL do produto (não página de busca). Deve conter o domínio ${sup.site}
5. sellerName, sellerRating, productRating: preencha APENAS se aparecer claramente. Se não aparecer, deixe ''
6. exactMatchScore: 0-100 quão parecido é com "${product}"
7. priceConfidence: 0-100 quão confiável é o preço
8. totalConfidence: média dos scores
9. Se não encontrar produto relevante: {"found":false,"reason":"motivo"}
10. NÃO invente vendedor, avaliação, reviews ou frete`;

  try{
    const raw=await callClaude(prompt,2500);
    const p=parseJson(raw);
    if(!p||!p.found)return{found:false};

    // Validação JS pós-retorno
    const validation=validateResult(p,queryMeta,sup);
    if(!validation.ok){
      console.warn("[PriceIQ] Rejeitado",sup.name,":",validation.reasons.join("; "));
      return{found:false,rejectedReasons:validation.reasons};
    }

    const price=parseFloat(p.price)||0;
    const freight=parseFloat(p.freight)||0;
    const priceMin=parseFloat(p.priceMin)||price;
    const priceMax=parseFloat(p.priceMax)||price;
    const total=price+freight;
    const cur=String(p.currency||sup.cur).toUpperCase();
    const rateUsed=cur==="USD"?set.usd:cur==="EUR"?set.eur:cur==="CNY"?set.cny:1;
    const brl=parseFloat((total*rateUsed).toFixed(2));
    const priceBRL=parseFloat((price*rateUsed).toFixed(2));
    const minBrl=parseFloat((priceMin*rateUsed).toFixed(2));
    const maxBrl=parseFloat((priceMax*rateUsed).toFixed(2));
    const freightBRL=parseFloat((freight*rateUsed).toFixed(2));

    return{
      found:true,
      id:"r"+Date.now()+Math.random().toString(36).slice(2,6),
      productName:String(p.productName||product).slice(0,150),
      supplier:sup.name,supId:sup.id,
      // TAREFA 7 — Vendedor
      sellerName:String(p.sellerName||""),
      sellerRating:String(p.sellerRating||""),
      sellerReviews:parseInt(p.sellerReviews)||0,
      // TAREFA 8 — Avaliação
      productRating:String(p.productRating||""),
      productReviews:parseInt(p.productReviews)||0,
      // TAREFA 5 — Preço real
      price,priceMin,priceMax,
      currency:cur,
      // TAREFA 2 — Conversão
      originalCurrency:cur,
      exchangePair:ratePair,
      exchangeRateUsed:rateUsed,
      priceBRL,
      rateSource:set.rateSource||"manual",
      rateTime:set.rateTime||"",
      rateTimestamp:set.rateTimestamp||0,
      // Totais
      freight,total,brl,
      freightBRL,
      priceMinBrl:minBrl,priceMaxBrl:maxBrl,
      // TAREFA 6 — Frete
      freeShip:p.freightNote==="grátis confirmado",
      freightNote:String(p.freightNote||"não encontrado"),
      freightSourceText:String(p.freightSourceText||""),
      needsManualFreightCheck:!!p.needsManualFreightCheck||(p.freightNote==="não encontrado"),
      // TAREFA 9 — Link
      link:String(p.link||sup.url.replace("{q}",encodeURIComponent(product))),
      available:p.available!==false,

      priceType:String(p.priceType||"real"),
      priceSourceText:String(p.priceSourceText||""),
      // TAREFA 4 — Scores
      exactMatchScore:parseInt(p.exactMatchScore)||75,
      priceConfidence:parseInt(p.priceConfidence)||75,
      totalConfidence:parseInt(p.totalConfidence)||75,
      warnings:Array.isArray(p.warnings)?p.warnings:[],
      note:String(p.note||""),
      ts:new Date().toISOString()
    };
  }catch(err){
    console.error("[PriceIQ]",sup.name,err.message);
    return{found:false};
  }
}

async function aiAnalyze(product,results){
  const set=ST.settings;
  const valid=results.filter(r=>r&&r.found!==false&&r.brl>0).sort((a,b)=>a.brl-b.brl);
  const bestPrice=valid[0];
  const bestRecommended=[...valid].sort((a,b)=>{
    const ac=(a.totalConfidence||75)+(a.sellerName?8:0)+(a.productRating?6:0)-(a.needsManualFreightCheck?5:0);
    const bc=(b.totalConfidence||75)+(b.sellerName?8:0)+(b.productRating?6:0)-(b.needsManualFreightCheck?5:0);
    const ap=((a.brl-(bestPrice?.brl||a.brl))/(bestPrice?.brl||a.brl))*30;
    const bp=((b.brl-(bestPrice?.brl||b.brl))/(bestPrice?.brl||b.brl))*30;
    return (bc-bp)-(ac-ap);
  })[0]||bestPrice;
  const worst=valid[valid.length-1];
  const alerts=[];
  if(valid.some(r=>r.needsManualFreightCheck||r.freightNote==="não encontrado")) alerts.push("Frete não encontrado em alguns resultados — confirme no site antes de comprar.");
  if(valid.some(r=>(r.totalConfidence||100)<75)) alerts.push("Alguns resultados têm confiança média — confira o link do produto.");
  if(valid.some(r=>r.currency&&r.currency!=="BRL")) alerts.push(`Cotação usada: USD ${fmt(set.usd)}, CNY ${set.cny?.toFixed?set.cny.toFixed(4):set.cny}, EUR ${fmt(set.eur)} (${set.rateSource||"manual"} ${set.rateTime||""}).`);
  return{
    bestChoice:bestRecommended?.supplier||bestPrice?.supplier||"—",
    bestPriceOnly:bestPrice?.supplier||"—",
    reason:bestRecommended&&bestPrice&&bestRecommended.supplier!==bestPrice.supplier
      ?`${bestRecommended.supplier} parece mais seguro pelos dados disponíveis, mesmo não sendo necessariamente o menor preço.`
      :"Menor custo total convertido para BRL.",
    summary:`${valid.length} fornecedor${valid.length!==1?"es":""} com resultado. Melhor preço: ${bestPrice?("R$ "+fmt(bestPrice.brl)+" em "+bestPrice.supplier):"—"}.`,
    alerts,
    resellerTip:bestPrice?`Sugestão de revenda com ${set.margin}%: R$ ${fmt(bestPrice.brl*(1+set.margin/100))}`:"",
    savings:worst&&bestPrice&&worst.brl>bestPrice.brl?`Economia de até R$ ${fmt(worst.brl-bestPrice.brl)} contra o maior preço.`:"",
    incompleteData:valid.filter(r=>!r.sellerName||!r.productRating||r.needsManualFreightCheck).map(r=>r.supplier)
  };
}


function supplierLine(s){
  return `- id:${s.id} | nome:${s.name} | site:${s.site} | moeda padrão:${s.cur} | país:${s.country} | link busca:${s.url}`;
}

async function searchAllSuppliers(product,targets,queryMeta){
  const set=ST.settings;
  const supplierList=targets.map(supplierLine).join("\n");
  const prompt=`Você é um agente especialista em comparação de preços. Pesquise o produto abaixo em TODOS os fornecedores listados usando Google Search e retorne dados 100% reais.

PRODUTO: "${product}"

FORNECEDORES ATIVOS (pesquise todos):
${supplierList}

INSTRUÇÕES DE PESQUISA:
1. Para cada fornecedor, use busca: "${product}" site:DOMINIO
2. Analise os resultados e identifique o produto correto — NÃO retorne acessórios, capas, cabos, peças ou produtos genéricos similares, a menos que o usuário tenha pesquisado exatamente isso.
3. Se encontrar MÚLTIPLOS produtos para o mesmo fornecedor, selecione o MELHOR usando este critério de custo-benefício:
   a) Calcule um score: score = (avaliação_produto * 20) + (reviews / 100) - (preço_relativo * 15)
   b) Priorize: produto com avaliação ≥ 4.0 + menor preço + mais reviews
   c) Se houver produto 30% mais caro mas com avaliação muito superior (≥4.5 vs <3.5), prefira o mais barato
   d) NUNCA retorne produto sem avaliação quando houver alternativa equivalente com avaliação
4. Colete: preço real visível, avaliação do produto, número de avaliações, nome do vendedor se disponível, frete, link direto do produto.
5. NÃO invente nenhum dado. Se não encontrar preço real, retorne found:false para esse fornecedor.

SELEÇÃO DO MELHOR PRODUTO (regra de ouro):
- Menor preço + boa avaliação (≥3.5) = ESCOLHER
- Menor preço sem avaliação nenhuma + alternativa com avaliação = ESCOLHER a com avaliação
- Diferença de até 20% no preço com avaliação muito melhor = ESCOLHER a melhor avaliada

REGRAS DE FRETE:
- "Frete grátis" confirmado → freight:0, freightNote:"grátis confirmado"
- Valor real encontrado → use o valor, freightNote:"real encontrado"
- Não encontrado → freight:0, freightNote:"não encontrado", needsManualFreightCheck:true

RETORNE APENAS JSON VÁLIDO neste formato exato:
{
  "results":[
    {
      "supplierId":"ml",
      "found":true,
      "productName":"nome exato do produto escolhido como melhor custo-benefício",
      "sellerName":"vendedor se encontrado ou vazio",

      "sellerReviews":0,
      "productRating":"avaliação real do produto (ex: 4.5) ou vazio se não encontrada",
      "productReviews":0,
      "price":0.00,
      "priceMin":0.00,
      "priceMax":0.00,
      "currency":"BRL",
      "link":"https://link-real-e-direto-do-produto",
      "available":true,
      "sellers":1,
      "freight":0.00,
      "freightNote":"grátis confirmado|real encontrado|não encontrado",
      "needsManualFreightCheck":false,
      "priceType":"real|a_partir_de|faixa|não_encontrado",
      "priceSourceText":"trecho curto que comprova o preço",
      "isExactProduct":true,
      "exactMatchScore":85,
      "priceConfidence":85,
      "totalConfidence":85,
      "warnings":[],
      "note":"motivo da escolha se houver múltiplos produtos disponíveis"
    }
  ]
}`;

  const raw=await callClaude(prompt,5500);
  const parsed=parseJson(raw);
  const arr=Array.isArray(parsed)?parsed:(Array.isArray(parsed?.results)?parsed.results:[]);
  const out=[];
  for(const p of arr){
    const sup=targets.find(s=>s.id===p.supplierId||s.name===p.supplier||s.name===p.supplierName);
    if(!sup) continue;
    if(!p||p.found===false||!p.productName||!(parseFloat(p.price)>0)) continue;
    const validation=validateResult(p,queryMeta,sup);
    if(!validation.ok){
      console.warn("[PriceIQ] Rejeitado",sup.name,":",validation.reasons.join("; "));
      continue;
    }
    const price=parseFloat(p.price)||0;
    const freight=parseFloat(p.freight)||0;
    const priceMin=parseFloat(p.priceMin)||price;
    const priceMax=parseFloat(p.priceMax)||price;
    const total=price+freight;
    const cur=String(p.currency||sup.cur).toUpperCase();
    const rateUsed=cur==="USD"?set.usd:cur==="EUR"?set.eur:cur==="CNY"?set.cny:1;
    const brl=parseFloat((total*rateUsed).toFixed(2));
    const priceBRL=parseFloat((price*rateUsed).toFixed(2));
    const freightBRL=parseFloat((freight*rateUsed).toFixed(2));
    const minBrl=parseFloat((priceMin*rateUsed).toFixed(2));
    const maxBrl=parseFloat((priceMax*rateUsed).toFixed(2));
    out.push({
      found:true,
      id:"r"+Date.now()+Math.random().toString(36).slice(2,6),
      productName:String(p.productName||product).slice(0,150),
      supplier:sup.name,supId:sup.id,
      sellerName:String(p.sellerName||""),
      sellerRating:String(p.sellerRating||""),
      sellerReviews:parseInt(p.sellerReviews)||0,
      productRating:String(p.productRating||p.rating||""),
      productReviews:parseInt(p.productReviews||p.reviews)||0,
      price,priceMin,priceMax,
      currency:cur,originalCurrency:cur,
      exchangePair:cur==="BRL"?"BRL":cur+"/BRL",
      exchangeRateUsed:rateUsed,
      priceBRL,
      rateSource:set.rateSource||"manual",
      rateTime:set.rateTime||"",
      rateTimestamp:set.rateTimestamp||0,
      freight,total,brl,freightBRL,
      priceMinBrl:minBrl,priceMaxBrl:maxBrl,
      freeShip:p.freightNote==="grátis confirmado"||p.freightNote==="grátis",
      freightNote:String(p.freightNote||"não encontrado"),
      needsManualFreightCheck:!!p.needsManualFreightCheck||(p.freightNote==="não encontrado"),
      link:String(p.link||sup.url.replace("{q}",encodeURIComponent(product))),
      available:p.available!==false,
      sellers:parseInt(p.sellers)||1,
      priceType:String(p.priceType||"real"),
      priceSourceText:String(p.priceSourceText||""),
      exactMatchScore:parseInt(p.exactMatchScore)||75,
      priceConfidence:parseInt(p.priceConfidence)||75,
      totalConfidence:parseInt(p.totalConfidence)||75,
      warnings:Array.isArray(p.warnings)?p.warnings:[],
      note:String(p.note||""),
      ts:new Date().toISOString()
    });
  }
  return out;
}

// SEARCH FLOW — por fornecedor, com progresso ao vivo
// ══════════════════════════════════════════════════════
async function doSearch(){
  const inp=document.getElementById("q-inp");
  const q=inp?inp.value.trim():ST.query.trim();
  if(!q){toast("Digite um produto","err");return}
  if(!getGeminiApiKey()){toast("Configure a Gemini API Key primeiro.","err");nav("settings");return}
  const active=ST.suppliers.filter(s=>s.on);
  const targets=ST.selIds.length?ST.suppliers.filter(s=>ST.selIds.includes(s.id)&&s.on):active;
  if(!targets.length){toast("Nenhum fornecedor ativo","err");return}

  ST.query=q;
  ST.searching=true;ST.results=[];ST.insight=null;ST.meta=null;ST.expandId=null;ST.searchErrors=[];
  ST.progDone=0;ST.progTotal=targets.length;ST.progCur=targets[0]?.name||"";
  nav("results");

  const queryMeta=interpretQuery(q);
  const hasIntl=targets.some(s=>s.cur!=="BRL");
  if(hasIntl)await fetchLiveRates();

  // ── Busca fornecedor por fornecedor com resultado ao vivo ──
  for(let i=0;i<targets.length;i++){
    const sup=targets[i];
    ST.progDone=i;ST.progCur=sup.name;updateProg();
    try{
      const r=await searchOneSupplier(q,sup,queryMeta);
      if(r.found){
        ST.results.push(r);
        ST.results.sort((a,b)=>a.brl-b.brl);
        renderResultCards();
      }else if(r.error){
        ST.searchErrors.push({supplier:sup.name,message:r.error});
      }
    }catch(e){
      console.error("[PriceIQ]",sup.name,e);
      ST.searchErrors.push({supplier:sup.name,message:e.message||String(e)});
    }
    ST.progDone=i+1;updateProg();
  }

  ST.searching=false;
  const m={id:"s"+Date.now(),query:q,ts:new Date().toISOString(),
    count:ST.results.length,bestBRL:ST.results[0]?.brl||0,bestSup:ST.results[0]?.supplier||""};
  ST.meta=m;
  ST.history=[m,...ST.history.slice(0,49)];
  persist();renderResults();

  // Mostra erros se não houve nenhum resultado
  if(!ST.results.length&&ST.searchErrors.length){
    const errMsg=ST.searchErrors.map(e=>e.supplier+": "+e.message).join(" | ");
    toast("Nenhum resultado. Erros: "+errMsg.slice(0,120),"err");
  }

  if(ST.results.length){
    ST.aiLoading=true;renderAiBox();
    try{ST.insight=await aiAnalyze(q,ST.results)}catch{ST.insight=null}
    ST.aiLoading=false;renderAiBox();
  }
}

function updateProg(){
  const fill=document.getElementById("prog-fill");
  const txt=document.getElementById("prog-txt");
  const cnt=document.getElementById("prog-cnt");
  const pct=ST.progTotal?Math.round(ST.progDone/ST.progTotal*100):0;
  if(fill)fill.style.width=pct+"%";
  if(txt)txt.textContent=ST.progCur?"Buscando "+ST.progCur+"…":"Processando…";
  if(cnt)cnt.textContent=ST.progDone+"/"+ST.progTotal;
}

function buildCards(){
  const results=ST.results;
  const ins=ST.insight;
  const bestBRL=results[0]?.brl||0;
  return results.map((r,i)=>{
    const isBestPrice=i===0;
    const isBestRec=ins&&ins.bestChoice===r.supplier;
    const isHighConf=r.totalConfidence>=85;
    const diff=bestBRL&&i>0?((r.brl-bestBRL)/bestBRL*100).toFixed(1):null;
    const isExp=ST.expandId===r.id;
    const resell=fmt((r.brl||0)*(1+ST.settings.margin/100));

    // Badges
    const badges=[
      isBestPrice?`<span class="tag" style="background:rgba(0,212,255,.12);color:#00D4FF;border:1px solid rgba(0,212,255,.3)">💰 Menor preço</span>`:"",
      isBestRec&&!isBestPrice?`<span class="tag" style="background:rgba(255,184,0,.12);color:#FFB800;border:1px solid rgba(255,184,0,.3)">${ico.trophy} Melhor opção</span>`:"",
      isBestRec&&isBestPrice?`<span class="tag" style="background:rgba(255,184,0,.12);color:#FFB800;border:1px solid rgba(255,184,0,.3)">${ico.trophy} Melhor opção</span>`:"",
      isHighConf?`<span class="tag" style="background:rgba(0,229,160,.1);color:#00E5A0;border:1px solid rgba(0,229,160,.3)">${ico.shield} Alta confiança</span>`:"",
      !r.available?`<span class="tag" style="background:rgba(255,77,109,.1);color:#FF4D6D;border:1px solid rgba(255,77,109,.3)">Indisponível</span>`:"",
      r.totalConfidence<75&&r.totalConfidence>0?`<span class="tag" style="background:rgba(255,184,0,.1);color:#FFB800;border:1px solid rgba(255,184,0,.3)">${ico.alert} Conferir dados</span>`:"",
      diff?`<span class="tag" style="background:rgba(74,85,104,.15);color:#8896AA;border:1px solid rgba(74,85,104,.3)">+${diff}% mais caro</span>`:"",
    ].filter(Boolean).join("");

    // Frete display
    let freightDisplay="";
    if(r.freeShip){
      freightDisplay=`<span style="color:#00E5A0;font-weight:700">Frete grátis ✅</span>`;
    } else if(r.freightNote==="não encontrado"||r.needsManualFreightCheck){
      freightDisplay=`<span style="color:#FFB800">Frete não encontrado — conferir no site</span>`;
    } else if(r.freight>0){
      freightDisplay=`<span>${esc(r.currency)} ${fmt(r.freight)} (R$ ${fmt(r.freightBRL)})</span>`;
    } else {
      freightDisplay=`<span style="color:#4A5568">Frete não encontrado</span>`;
    }

    // Avaliação display
    const ratingDisplay=r.productRating
      ?`<span style="color:#FFB800">${ico.star} ${esc(r.productRating)}</span>${r.productReviews?`<span style="color:#4A5568;font-size:11px"> (${r.productReviews})</span>`:""}`
      :`<span style="color:#4A5568;font-style:italic">Avaliação não encontrada</span>`;

    // Vendedor display
    const sellerDisplay=r.sellerName
      ?`<span style="color:#8896AA">${esc(r.sellerName)}</span>${r.sellerRating?`<span style="color:#FFB800;font-size:11px"> ⭐${esc(r.sellerRating)}</span>`:""}`
      :`<span style="color:#4A5568;font-style:italic">Vendedor não encontrado</span>`;

    // Cotação display
    const rateDisplay=r.currency!=="BRL"
      ?`<div style="background:#070B14;border-radius:8px;padding:7px 10px;font-size:11px;color:#4A5568;margin-bottom:8px">
          ${ico.info} <span style="color:#8896AA">${esc(r.currency)}/BRL: <strong style="color:#00D4FF">${r.exchangeRateUsed||"—"}</strong></span>
          <span style="margin-left:8px">${r.rateSource?"Fonte: "+esc(r.rateSource):"cotação manual"}</span>
          ${r.rateTime?`<span style="margin-left:6px">· ${esc(r.rateTime)}</span>`:""}
        </div>`:""

    // Expanded details
    const expandedHTML=isExp?`
      <div class="res-extra open">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Produto encontrado</p><p style="color:#E8F0FE;font-size:13px">${esc(r.productName)}</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Fornecedor</p><p style="color:#E8F0FE;font-size:13px">${esc(r.supplier)}</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Vendedor</p><p style="font-size:13px">${sellerDisplay}</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Avaliação</p><p style="font-size:13px">${ratingDisplay}</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Preço original</p><p style="color:#E8F0FE;font-size:13px;font-weight:700">${esc(r.currency)} ${fmt(r.price)}</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Preço em BRL</p><p style="color:#00D4FF;font-size:13px;font-weight:700">R$ ${fmt(r.priceBRL||r.brl)}</p></div>
          ${r.currency!=="BRL"?`<div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Cotação usada</p><p style="color:#E8F0FE;font-size:13px">${esc(r.exchangePair)} = ${r.exchangeRateUsed} · ${esc(r.rateSource||"manual")} ${esc(r.rateTime||"")}</p></div>`:""}
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Disponível</p><p style="color:#E8F0FE;font-size:13px">${r.available?"✅ Sim":"❌ Não"}</p></div>
          ${r.sellers>1?`<div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Vendedores</p><p style="color:#E8F0FE;font-size:13px">${r.sellers} ofertas · R$ ${fmt(r.priceMinBrl)}–R$ ${fmt(r.priceMaxBrl)}</p></div>`:""}
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Confiança</p><p class="${r.totalConfidence>=85?"conf-high":r.totalConfidence>=70?"conf-med":"conf-low"}" style="font-size:13px;font-weight:700">${r.totalConfidence||"—"}%</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Horário busca</p><p style="color:#E8F0FE;font-size:13px">${fmtDate(r.ts)}</p></div>
        </div>
        ${r.priceSourceText?`<p style="color:#4A5568;font-size:11px;margin-bottom:8px;padding:7px 10px;background:#0D1320;border-radius:8px">💬 Preço: "${esc(r.priceSourceText)}"</p>`:""}
        ${r.freightSourceText?`<p style="color:#4A5568;font-size:11px;margin-bottom:8px;padding:7px 10px;background:#0D1320;border-radius:8px">🚚 Frete: "${esc(r.freightSourceText)}"</p>`:""}
        ${r.warnings&&r.warnings.length?r.warnings.map(w=>`<p style="color:#FFB800;font-size:12px;margin-bottom:4px">⚠️ ${esc(w)}</p>`).join(""):""}
        ${r.note?`<p style="color:#8896AA;font-size:12px;padding:9px 12px;background:#0D1320;border-radius:8px;margin-top:4px">${esc(r.note)}</p>`:""}
      </div>`:"";

    const cardClass=`res-card${isBestPrice?" best":""}${isBestRec&&!isBestPrice?" recommended":""}`;

    return`<div class="${cardClass}">
      <div class="res-body">
        <!-- Badges -->
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">${badges}</div>
        <!-- Nome e preço -->
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px">
          <div style="flex:1;min-width:0">
            <p style="color:#E8F0FE;font-size:15px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.productName)}</p>
            <p style="color:#00D4FF;font-size:13px;font-weight:600">${esc(r.supplier)}</p>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <p style="color:${isBestPrice?"#00D4FF":"#E8F0FE"};font-size:22px;font-weight:800;margin:0">R$ ${fmt(r.brl)}</p>
            ${r.currency!=="BRL"?`<p style="color:#4A5568;font-size:11px">${esc(r.currency)} ${fmt(r.price)}</p>`:""}
          </div>
        </div>
        <!-- Cotação info (apenas internacionais) -->
        ${rateDisplay}
        <!-- Grid de dados -->
        <div class="pgrid">
          <div class="pcell">
            <p class="plabel">Frete</p>
            <p class="pval" style="font-size:12px">${freightDisplay}</p>
          </div>
          <div class="pcell">
            <p class="plabel">Avaliação</p>
            <p class="pval" style="font-size:12px">${ratingDisplay}</p>
          </div>
          <div class="pcell">
            <p class="plabel">Revenda ${ST.settings.margin}%</p>
            <p class="pval" style="color:#00E5A0">R$ ${resell}</p>
          </div>
        </div>
        <!-- Vendedor -->
        <div style="margin-bottom:12px;font-size:12px">
          <span style="color:#4A5568;font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.3px">Vendedor: </span>${sellerDisplay}
        </div>
        <!-- Botões — todos com mesmo estilo base -->
        <div class="arow">
          <a href="${esc(r.link)}" target="_blank" rel="noopener noreferrer" class="arow-btn primary">${ico.link} Ver Produto</a>
          <button class="arow-btn icon-only" data-rid="${esc(r.id)}" onclick="toggleExpand(this)" title="Detalhes">${ico.eye}</button>
          <button class="arow-btn icon-only danger" data-rid="${esc(r.id)}" onclick="delResult(this)" title="Remover">${ico.trash}</button>
        </div>
        <!-- Horário -->
        <p style="color:#4A5568;font-size:10px;margin-top:8px;text-align:right">${fmtDate(r.ts)}</p>
      </div>
      ${expandedHTML}
    </div>`;
  }).join("");
}

async function doExport(type){
  if(type==="csv"){
    const h=["Produto","Fornecedor","Vendedor","Avaliação","Reviews","Preço orig","Moeda","Câmbio","Preço BRL","Frete","Frete BRL","Frete nota","Total BRL","Disponível","Confiança","Link","Data"];
    const rows=ST.results.map(r=>[
      r.productName,r.supplier,r.sellerName||"",
      r.productRating||"",r.productReviews||0,
      r.price,r.currency,r.exchangeRateUsed||1,
      fmt(r.priceBRL||r.brl),
      r.freight,fmt(r.freightBRL||0),r.freightNote,
      fmt(r.brl),r.available?"Sim":"Não",
      r.totalConfidence+"%",r.link,
      new Date(r.ts).toLocaleString("pt-BR")
    ]);
    const csv=[h,...rows].map(row=>row.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=(ST.meta?.query||"precos").replace(/\s+/g,"_")+".csv";
    a.click();toast("CSV baixado!");
  }else{
    const q=ST.meta?.query||ST.query;
    const s=ST.settings;
    const lines=[`🔍 *PriceIQ — ${q}*\n📅 ${new Date().toLocaleString("pt-BR")}\n`];
    if(s.usd>0)lines.push(`💱 Cotação: USD ${fmt(s.usd)} · CNY ${s.cny} · Fonte: ${s.rateSource||"manual"}\n`);
    ST.results.forEach((r,i)=>{
      const m=["🥇","🥈","🥉"][i]||`${i+1}.`;
      lines.push(`${m} *${r.supplier}*`);
      lines.push(`   💰 R$ ${fmt(r.brl)} (${r.currency} ${fmt(r.price)})`);
      lines.push(`   🚚 ${r.freeShip?"Frete grátis ✅":r.freightNote==="não encontrado"?"Frete: conferir no site ⚠️":`Frete: ${r.currency} ${fmt(r.freight)}`}`);
      if(r.sellerName)lines.push(`   🏪 ${r.sellerName}`);
      if(r.productRating)lines.push(`   ⭐ ${r.productRating} (${r.productReviews} avaliações)`);
      lines.push(`   ${r.available?"✅ Disponível":"❌ Indisponível"}`);
      lines.push(`   🔗 ${r.link}\n`);
    });
    lines.push(`_via PriceIQ_`);
    const text=lines.join("\n");
    if(navigator.share){try{await navigator.share({title:`Preços: ${q}`,text});return}catch{}}
    try{await navigator.clipboard.writeText(text);toast("Copiado!");}
    catch{toast("Não foi possível copiar","err")}
  }
}

        <div style="display:flex;gap:6px;flex-shrink:0">
          <button data-sid="${esc(s.id)}" onclick="toggleSupOn(this)" style="background:${s.on?"rgba(0,229,160,.1)":"#0D1320"};border:1px solid ${s.on?"rgba(0,229,160,.4)":"#1C2A3A"};border-radius:8px;padding:9px;display:flex;align-items:center;color:${s.on?"#00E5A0":"#4A5568"}">${ico.check}</button>
          <button data-sid="${esc(s.id)}" onclick="openEditSup(this)" style="background:#0D1320;border:1px solid #1C2A3A;border-radius:8px;padding:9px;display:flex;align-items:center;color:#8896AA">${ico.edit}</button>
          <button data-sid="${esc(s.id)}" onclick="delSup(this)" style="background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.2);border-radius:8px;padding:9px;display:flex;align-items:center;color:#FF4D6D">${ico.trash}</button>
        </div>
      </div>
    </div>`).join("");

  document.getElementById("page-suppliers").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>
        <h2 style="color:#E8F0FE;font-size:20px;font-weight:800;margin-bottom:3px">Fornecedores</h2>
        <p style="color:#4A5568;font-size:13px">${ST.suppliers.length} cadastrados · ${active} ativos</p>
      </div>
      <button class="btn btn-p btn-sm" onclick="openNewSup()">${ico.plus} Adicionar</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn btn-g btn-sm" onclick="resetSuppliers()" style="flex:1">${ico.refresh} Restaurar padrão</button>
    </div>
    <div id="sup-form-area">${formHTML}</div>
    <div id="sup-list">${list}</div>
  `;
}

function resetSuppliers(){
  if(!confirm("Restaurar a lista padrão de fornecedores? Isso substituirá os fornecedores atuais (não afeta histórico nem cotações)."))return;
  ST.suppliers=JSON.parse(JSON.stringify(DEF_SUP));
  ST.selIds=[];
  persist();toast("Fornecedores restaurados!");renderSuppliers();
}

function buildSupForm(){
  const d=ST.sfData||{};
  return`
    <div class="card" style="border-color:rgba(0,212,255,.28);margin-bottom:18px">
      <h3 style="color:#E8F0FE;font-size:16px;font-weight:700;margin-bottom:18px">${ST.sfMode==="edit"?"Editar":"Novo"} Fornecedor</h3>
      <div style="display:flex;flex-direction:column;gap:14px">
        <div class="g2">
          <div><label class="lbl">Nome *</label><input id="sf-name" class="inp" placeholder="Ex: Amazon" value="${esc(d.name||"")}"/></div>
          <div><label class="lbl">Site *</label><input id="sf-site" class="inp" placeholder="amazon.com.br" value="${esc(d.site||"")}"/></div>
        </div>
        <div>
          <label class="lbl">URL de busca * (use {q} para o produto)</label>
          <input id="sf-url" class="inp" placeholder="https://amazon.com.br/s?k={q}" value="${esc(d.url||"")}"/>
          <p style="color:#4A5568;font-size:11px;margin-top:5px">Exemplo: https://lista.mercadolivre.com.br/{q}</p>
        </div>
        <div><label class="lbl">Observações</label><input id="sf-note" class="inp" placeholder="Notas..." value="${esc(d.note||"")}"/></div>
        <div class="g3">
          <div><label class="lbl">Tipo</label><select id="sf-type" class="inp">${["Nacional","Internacional","Atacado","Fabricante"].map(o=>`<option${(d.type||"Nacional")===o?" selected":""}>${esc(o)}</option>`).join("")}</select></div>
          <div><label class="lbl">País</label><select id="sf-country" class="inp">${["Brasil","China","EUA","Alemanha","Outro"].map(o=>`<option${(d.country||"Brasil")===o?" selected":""}>${esc(o)}</option>`).join("")}</select></div>
          <div><label class="lbl">Moeda</label><select id="sf-cur" class="inp">${["BRL","USD","EUR","CNY"].map(o=>`<option${(d.cur||"BRL")===o?" selected":""}>${esc(o)}</option>`).join("")}</select></div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <button id="sf-tog" class="tog${d.on!==false?" on":""}" style="background:${d.on!==false?"#00D4FF":"#1C2A3A"}" onclick="toggleSfOn()">
            <div class="tog-dot"></div>
          </button>
          <span id="sf-on-lbl" style="color:#8896AA;font-size:14px">Fornecedor ${d.on!==false?"ativo":"inativo"}</span>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-p" onclick="saveSupForm()" style="flex:1">${ico.save} Salvar</button>
          <button class="btn btn-g" onclick="cancelSupForm()" style="flex:1">Cancelar</button>
        </div>
      </div>
    </div>`;
}

function openNewSup(){
  ST.sfMode="new";ST.sfId=null;
  ST.sfData={name:"",site:"",url:"",type:"Nacional",country:"Brasil",cur:"BRL",note:"",on:true};
  const area=document.getElementById("sup-form-area");
  if(area)area.innerHTML=buildSupForm();
}
function openEditSup(btn){
  const sid=btn.getAttribute("data-sid");
  const s=ST.suppliers.find(x=>x.id===sid);
  if(!s)return;
  ST.sfMode="edit";ST.sfId=sid;ST.sfData={...s};
  const area=document.getElementById("sup-form-area");
  if(area)area.innerHTML=buildSupForm();
}
function toggleSfOn(){
  const tog=document.getElementById("sf-tog");
  const lbl=document.getElementById("sf-on-lbl");
  if(!tog)return;
  const isOn=tog.classList.contains("on");
  tog.classList.toggle("on",!isOn);
  tog.style.background=!isOn?"#00D4FF":"#1C2A3A";
  if(lbl)lbl.textContent="Fornecedor "+(!isOn?"ativo":"inativo");
  if(ST.sfData)ST.sfData.on=!isOn;
}
function saveSupForm(){
  const g=id=>(document.getElementById(id)||{}).value||"";
  const name=g("sf-name").trim(),site=g("sf-site").trim(),url=g("sf-url").trim();
  if(!name||!site){toast("Nome e site obrigatórios","err");return}
  if(!url.includes("{q}")){toast("URL deve conter {q}","err");return}
  const on=document.getElementById("sf-tog")?.classList.contains("on")!==false;
  const data={name,site,url,note:g("sf-note").trim(),type:g("sf-type"),country:g("sf-country"),cur:g("sf-cur"),on};
  if(ST.sfMode==="edit")ST.suppliers=ST.suppliers.map(s=>s.id===ST.sfId?{...s,...data}:s);
  else ST.suppliers=[...ST.suppliers,{...data,id:"sup"+Date.now()}];
  ST.sfMode=null;ST.sfId=null;ST.sfData=null;
  persist();toast("Salvo!");renderSuppliers();
}
function cancelSupForm(){
  ST.sfMode=null;ST.sfId=null;ST.sfData=null;
  const area=document.getElementById("sup-form-area");
  if(area)area.innerHTML="";
}
function toggleSupOn(btn){
  const sid=btn.getAttribute("data-sid");
  ST.suppliers=ST.suppliers.map(s=>s.id===sid?{...s,on:!s.on}:s);
  persist();renderSuppliers();
}
function delSup(btn){
  const sid=btn.getAttribute("data-sid");
  ST.suppliers=ST.suppliers.filter(s=>s.id!==sid);
  persist();toast("Removido.");renderSuppliers();
}

// ══════════════════════════════════════════════════════
// HISTORY
// ══════════════════════════════════════════════════════
function renderHistory(){
  const items=ST.saved.map((rec,i)=>{
    const b=rec.results?.[0];
    return`
      <div class="card" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px">
          <div style="flex:1;min-width:0">
            <p style="color:#E8F0FE;font-weight:700;font-size:16px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rec.query)}</p>
            <p style="color:#4A5568;font-size:12px">${new Date(rec.ts).toLocaleString("pt-BR")} · ${rec.count} resultado${rec.count!==1?"s":""}</p>
          </div>
          ${b?`<div style="text-align:right;flex-shrink:0">
            <p style="color:#4A5568;font-size:10px;margin-bottom:2px">Melhor preço</p>
            <p style="color:#00D4FF;font-weight:800;font-size:17px">R$ ${fmt(b.brl)}</p>
            <p style="color:#4A5568;font-size:10px">${esc(b.supplier)}</p>
          </div>`:""}
        </div>
        ${rec.insight?.bestChoice?`<div style="background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.3);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px"><span style="color:#FFB800;font-weight:700">${ico.trophy} Melhor opção: </span><span style="color:#8896AA">${esc(rec.insight.bestChoice)}</span></div>`:""}
        <div style="display:flex;gap:8px">
          <button class="btn btn-p" data-ridx="${i}" onclick="loadSaved(this)" style="flex:1">${ico.eye} Ver Resultados</button>
          <button class="btn btn-d btn-sm" data-ridx="${i}" onclick="delSaved(this)">${ico.trash}</button>
        </div>
      </div>`;
  }).join("");

  document.getElementById("page-history").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div>
        <h2 style="color:#E8F0FE;font-size:20px;font-weight:800;margin-bottom:3px">Histórico</h2>
        <p style="color:#4A5568;font-size:13px">${ST.saved.length} pesquisas salvas</p>
      </div>
      ${ST.saved.length?`<button class="btn btn-d btn-sm" onclick="clearSaved()">${ico.trash} Limpar</button>`:""}
    </div>
    ${ST.saved.length?items:`
      <div style="text-align:center;padding:60px 20px;background:#111827;border-radius:18px;border:1px solid #1C2A3A">
        <p style="color:#8896AA;font-size:16px;font-weight:700;margin-bottom:6px">Nenhuma pesquisa salva</p>
        <p style="color:#4A5568;font-size:14px">Faça uma busca e clique em Salvar.</p>
      </div>`}
  `;
}
function loadSaved(btn){
  const idx=parseInt(btn.getAttribute("data-ridx"));
  const rec=ST.saved[idx];
  if(!rec)return;
  ST.query=rec.query;ST.results=rec.results||[];ST.insight=rec.insight||null;ST.meta=rec;ST.expandId=null;
  nav("results");
}
function delSaved(btn){
  const idx=parseInt(btn.getAttribute("data-ridx"));
  ST.saved.splice(idx,1);persist();renderHistory();
}
function clearSaved(){ST.saved=[];persist();toast("Limpo.");renderHistory()}

// ══════════════════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════════════════
function renderSettings(){
  const s=ST.settings;
  const ex=50,tot=ex*s.usd+Number(s.freight),res=tot*(1+s.margin/100);
  const rateStale=s.rateTimestamp&&(Date.now()-s.rateTimestamp)>RATE_TTL;

  document.getElementById("page-settings").innerHTML=`
    <h2 style="color:#E8F0FE;font-size:20px;font-weight:800;margin-bottom:20px">Configurações</h2>
    <div style="display:flex;flex-direction:column;gap:14px">

      <!-- Gemini API -->
      <div class="card" style="border-color:rgba(0,212,255,.28)">
        <p style="color:#00D4FF;font-size:13px;font-weight:700;text-transform:uppercase;margin-bottom:14px;letter-spacing:.5px">🤖 Gemini API</p>
        <label class="lbl">Gemini API Key</label>
        <input id="set-api" class="inp" type="password" placeholder="Cole a chave Gemini aqui" value="${esc(s.apiKey||"")}"/>
        <div class="g2" style="margin-top:12px">
          <div>
            <label class="lbl">Modelo</label>
            <select id="set-model" class="inp">
              <option value="gemini-2.5-flash-lite" ${(s.geminiModel||"gemini-2.5-flash-lite")==="gemini-2.5-flash-lite"?"selected":""}>gemini-2.5-flash-lite</option>
              <option value="gemini-2.5-flash" ${s.geminiModel==="gemini-2.5-flash"?"selected":""}>gemini-2.5-flash</option>
            </select>
          </div>
          <div style="display:flex;align-items:end">
            <button class="btn btn-g" onclick="testGeminiAPI()">Testar Gemini API</button>
          </div>
        </div>
        <p style="color:#4A5568;font-size:11px;margin-top:10px">A chave fica salva apenas neste aparelho. Não cole a chave em chats ou repositórios públicos.</p>
      </div>

      <!-- Cotação ao vivo -->
      <div class="card" style="border-color:rgba(0,212,255,.28)">
        <p style="color:#00D4FF;font-size:13px;font-weight:700;text-transform:uppercase;margin-bottom:14px;letter-spacing:.5px">💱 Cotação ao vivo — automática (1h)</p>
        <div class="g3" style="margin-bottom:14px">
          <div style="background:#070B14;border-radius:10px;padding:10px 12px">
            <p style="color:#4A5568;font-size:10px;margin-bottom:3px">USD/BRL</p>
            <p style="color:#00D4FF;font-weight:800;font-size:16px">R$ ${s.usd>0?fmt(s.usd):"—"}</p>
          </div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px">
            <p style="color:#4A5568;font-size:10px;margin-bottom:3px">CNY/BRL</p>
            <p style="color:#00D4FF;font-weight:800;font-size:16px">R$ ${s.cny>0?s.cny.toFixed(4):"—"}</p>
          </div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px">
            <p style="color:#4A5568;font-size:10px;margin-bottom:3px">EUR/BRL</p>
            <p style="color:#00D4FF;font-weight:800;font-size:16px">R$ ${s.eur>0?fmt(s.eur):"—"}</p>
          </div>
        </div>
        <p style="color:${rateStale?"#FFB800":"#4A5568"};font-size:12px;margin-bottom:12px">
          ${rateStale?"⚠️ Cotação desatualizada · ":""}Fonte: ${s.rateSource||"não atualizado"} · Última atualização: ${s.rateTime||"—"} (${rateAge()})
        </p>
        <button class="btn btn-p" onclick="refreshRatesSettings()">${ico.refresh} Atualizar cotação agora</button>
      </div>

      <!-- Câmbio manual -->
      <div class="card">
        <p style="color:#8896AA;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:6px;letter-spacing:.5px">✏️ Correção manual de câmbio</p>
        <p style="color:#4A5568;font-size:11px;margin-bottom:14px">Edite os valores e clique em <strong style="color:#8896AA">Salvar</strong> para aplicar imediatamente. A cotação manual será usada por 1 hora antes da próxima atualização automática.</p>
        <div class="g3">
          <div><label class="lbl">USD→BRL</label><input id="set-usd" type="number" step=".0001" class="inp" value="${s.usd}"/></div>
          <div><label class="lbl">EUR→BRL</label><input id="set-eur" type="number" step=".0001" class="inp" value="${s.eur}"/></div>
          <div><label class="lbl">CNY→BRL</label><input id="set-cny" type="number" step=".0001" class="inp" value="${s.cny}"/></div>
        </div>
      </div>

      <!-- Frete & Margem -->
      <div class="card">
        <p style="color:#8896AA;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:14px;letter-spacing:.5px">Frete & Margem</p>
        <div class="g2">
          <div>
            <label class="lbl">Frete padrão (R$)</label>
            <input id="set-frt" type="number" step="1" class="inp" value="${s.freight}"/>
            <p style="color:#4A5568;font-size:11px;margin-top:5px">Apenas simulação quando frete não encontrado</p>
          </div>
          <div>
            <label class="lbl">Margem de lucro (%)</label>
            <input id="set-mrg" type="number" step="1" class="inp" value="${s.margin}"/>
            <p style="color:#4A5568;font-size:11px;margin-top:5px">Para sugestão de revenda</p>
          </div>
        </div>
      </div>

      <!-- Simulação -->
      <div style="background:linear-gradient(135deg,rgba(0,212,255,.09),rgba(0,102,255,.05));border:1px solid rgba(0,212,255,.28);border-radius:16px;padding:18px">
        <p style="color:#00D4FF;font-size:13px;font-weight:700;margin-bottom:14px">🧮 Simulação: produto USD 50</p>
        <div class="g2">
          <div style="background:#070B14;border-radius:10px;padding:10px 12px"><p style="color:#4A5568;font-size:11px;margin-bottom:3px">USD 50 em BRL</p><p style="color:#E8F0FE;font-weight:700;font-size:15px">R$ ${fmt(ex*s.usd)}</p></div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px"><p style="color:#4A5568;font-size:11px;margin-bottom:3px">Frete padrão (sim.)</p><p style="color:#E8F0FE;font-weight:700;font-size:15px">R$ ${fmt(s.freight)}</p></div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px"><p style="color:#4A5568;font-size:11px;margin-bottom:3px">Total importado</p><p style="color:#E8F0FE;font-weight:700;font-size:15px">R$ ${fmt(tot)}</p></div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px"><p style="color:#4A5568;font-size:11px;margin-bottom:3px">Revenda (${s.margin}%)</p><p style="color:#00E5A0;font-weight:700;font-size:15px">R$ ${fmt(res)}</p></div>
        </div>
      </div>

      <button class="btn btn-p" onclick="saveSettings()">${ico.save} Salvar Configurações</button>
    </div>
  `;
}

async function refreshRatesSettings(){
  toast("Atualizando cotações…");
  await fetchLiveRates(true);
  renderSettings();
  if(ST.settings.rateTimestamp)toast("Cotação atualizada!");
  else toast("Não foi possível atualizar. Último valor mantido.","err");
}

function saveSettings(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:""};
  const newUsd=parseFloat(g("set-usd"))||ST.settings.usd;
  const newEur=parseFloat(g("set-eur"))||ST.settings.eur;
  const newCny=parseFloat(g("set-cny"))||ST.settings.cny;
  const ratesChanged=(newUsd!==ST.settings.usd||newEur!==ST.settings.eur||newCny!==ST.settings.cny);
  const timeStr=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  ST.settings={
    ...ST.settings,
    usd:newUsd,
    eur:newEur,
    cny:newCny,
    freight:parseFloat(g("set-frt"))||25,
    margin:parseFloat(g("set-mrg"))||30,
    apiKey:String(g("set-api")||ST.settings.apiKey||"").trim(),
    geminiModel:String(g("set-model")||ST.settings.geminiModel||"gemini-2.5-flash-lite").trim(),
    // Quando o usuário altera taxas manualmente, marca como manual e atualiza timestamp
    // para que fetchLiveRates() trate os valores novos como cache válido por 1h
    ...(ratesChanged?{rateSource:"manual",rateTime:timeStr,rateTimestamp:Date.now()}:{})
  };
  LS.s("piq_gemini_key",ST.settings.apiKey);
  persist();
  if(ratesChanged)toast(`Taxas manuais salvas: USD ${newUsd.toFixed(2)} · EUR ${newEur.toFixed(2)} · CNY ${newCny.toFixed(4)}`);
  else toast("Configurações salvas!");
  updateNavRateSub();
  renderSettings();
}

// ══════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════
renderHome();
// Busca cotação em background ao abrir o app
fetchLiveRates().then(()=>{
  updateNavRateSub();
  if(ST.view==="home")renderHome();
  if(ST.view==="settings")renderSettings();
}).catch(()=>{});
// Auto-refresh de cotação a cada 1 hora
setInterval(()=>{
  fetchLiveRates(true).then(()=>{
    updateNavRateSub();
    if(ST.view==="home")renderHome();
    if(ST.view==="settings")renderSettings();
  }).catch(()=>{});
},RATE_TTL);
</script>
</body>
</html>
