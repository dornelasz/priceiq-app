<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#070B14"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>PriceIQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#070B14;color:#E8F0FE;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overscroll-behavior:none;-webkit-text-size-adjust:100%}
a,button,input,select,textarea{font-family:inherit}
input:focus,select:focus{outline:none;border-color:rgba(0,212,255,.5)!important}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:#1C2A3A;border-radius:9px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
#app{display:flex;flex-direction:column;min-height:100vh}
#nav{background:#0D1320;border-bottom:1px solid #1C2A3A;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:60px;flex-shrink:0}
.logo-box{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#00D4FF,#0066FF);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-title{font-size:16px;font-weight:800;color:#E8F0FE;letter-spacing:-.4px}
.logo-sub{font-size:10px;color:#4A5568;font-weight:600;margin-top:-2px}
.nb{background:transparent;border:1px solid transparent!important;border-radius:9px;padding:6px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px;color:#4A5568;font-size:9px;font-weight:700;transition:all .15s}
.nb.on{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.28)!important;color:#00D4FF}
.page{padding:16px 16px 90px;max-width:700px;margin:0 auto;width:100%;animation:fadeIn .2s ease}
.hidden{display:none!important}
.card{background:#111827;border:1px solid #1C2A3A;border-radius:16px;padding:18px}
.card+.card{margin-top:12px}
.inp{width:100%;background:#070B14;border:1px solid #1C2A3A;border-radius:10px;padding:13px 14px;color:#E8F0FE;font-size:15px;display:block;-webkit-appearance:none;appearance:none}
.inp::placeholder{color:#4A5568}
select.inp{background-image:none;cursor:pointer}
.btn{border-radius:11px;padding:13px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;width:100%;transition:opacity .15s;border:none}
.btn:active{opacity:.8}
.btn-p{background:linear-gradient(135deg,#00D4FF,#0066FF);color:#fff}
.btn-g{background:#0D1320;color:#8896AA;border:1px solid #1C2A3A!important}
.btn-d{background:rgba(255,77,109,.1);color:#FF4D6D;border:1px solid rgba(255,77,109,.2)!important}
.btn-sm{padding:9px 14px;font-size:13px;width:auto}
.btn:disabled,.btn[disabled]{opacity:.4;pointer-events:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid #1C2A3A;background:#0D1320;color:#8896AA;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:all .15s;cursor:pointer}
.chip.on{border-color:#00D4FF;background:rgba(0,212,255,.1);color:#00D4FF}
.tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.3px;display:inline-flex;align-items:center;flex-shrink:0}
.prog-wrap{background:#0D1320;border-radius:99px;height:6px;overflow:hidden;margin-top:10px}
.prog-fill{background:linear-gradient(135deg,#00D4FF,#0066FF);height:100%;border-radius:99px;width:0%;transition:width .4s ease}
.res-card{border-radius:18px;overflow:hidden;margin-bottom:14px;border:1px solid #1C2A3A;background:#111827}
.res-card.best{background:linear-gradient(135deg,rgba(0,212,255,.07),rgba(0,102,255,.04));border-color:rgba(0,212,255,.28);box-shadow:0 4px 24px rgba(0,212,255,.1)}
.res-card.recommended{border-color:rgba(255,184,0,.4);box-shadow:0 4px 24px rgba(255,184,0,.1)}
.res-body{padding:16px 18px}
.res-extra{border-top:1px solid #1C2A3A;padding:14px 18px;background:#070B14;display:none}
.res-extra.open{display:block}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.pcell{background:#070B14;border-radius:10px;padding:9px 11px}
.plabel{color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.pval{color:#E8F0FE;font-size:13px;font-weight:700}
/* UNIFIED BUTTON ROW — all buttons same style, only color differs */
.arow{display:flex;gap:8px;margin-top:12px}
.arow-btn{flex:1;border-radius:10px;padding:11px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:1px solid #1C2A3A;background:#0D1320;color:#8896AA;cursor:pointer;transition:opacity .15s;font-family:inherit}
.arow-btn:active{opacity:.75}
.arow-btn.primary{background:linear-gradient(135deg,#00D4FF,#0066FF);color:#fff;border-color:transparent}
.arow-btn.danger{background:rgba(255,77,109,.1);color:#FF4D6D;border-color:rgba(255,77,109,.2)}
.arow-btn.icon-only{flex:0 0 auto;padding:11px 13px}
.ai-box{background:linear-gradient(135deg,rgba(0,212,255,.09),rgba(0,102,255,.05));border:1px solid rgba(0,212,255,.28);border-radius:18px;padding:20px;margin-bottom:18px}
.ai-best{background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.3);border-radius:12px;padding:12px 16px;margin-bottom:12px}
.tog{width:50px;height:28px;border-radius:99px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.tog-dot{width:22px;height:22px;border-radius:99px;background:#fff;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.tog.on .tog-dot{left:25px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.lbl{color:#8896AA;font-size:11px;font-weight:700;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,.5);align-items:center;gap:8px;white-space:nowrap;display:none;animation:fadeIn .2s ease;max-width:90vw}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.5)}
.bottom-sheet{position:fixed;bottom:0;left:0;right:0;z-index:201;background:#111827;border-radius:20px 20px 0 0;padding:20px 16px 40px;border-top:1px solid #1C2A3A}
.bs-item{width:100%;background:transparent;border:none;border-radius:10px;padding:14px 16px;color:#E8F0FE;font-size:15px;text-align:left;display:flex;align-items:center;gap:12px;font-weight:600;cursor:pointer}
.bs-item:active{background:rgba(255,255,255,.05)}
.hcard{background:#111827;border:1px solid #1C2A3A;border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.conf-high{color:#00E5A0}.conf-med{color:#FFB800}.conf-low{color:#FF4D6D}
.rate-bar{background:#111827;border:1px solid #1C2A3A;border-radius:12px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
</style>
</head>
<body>
<div id="app">
  <nav id="nav">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      </div>
      <div>
        <div class="logo-title">PriceIQ</div>
        <div class="logo-sub" id="nav-rate-sub">Comparador com IA</div>
      </div>
    </div>
    <div style="display:flex;gap:2px">
      <button class="nb on" id="nb-home" onclick="nav('home')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Início
      </button>
      <button class="nb" id="nb-suppliers" onclick="nav('suppliers')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Lojas
      </button>
      <button class="nb" id="nb-history" onclick="nav('history')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 0 .5-4M3 3v5h5"/></svg>
        Histórico
      </button>
      <button class="nb" id="nb-settings" onclick="nav('settings')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Config
      </button>
    </div>
  </nav>
  <div id="page-home" class="page"></div>
  <div id="page-suppliers" class="page hidden"></div>
  <div id="page-history" class="page hidden"></div>
  <div id="page-settings" class="page hidden"></div>
  <div id="page-results" class="page hidden"></div>
</div>
<div id="toast"></div>
<div id="overlay" class="overlay hidden" onclick="closeSheet()"></div>
<div id="sheet" class="bottom-sheet hidden"></div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════════════════
const LS={
  g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

// ══════════════════════════════════════════════════════
// DEFAULT DATA
// ══════════════════════════════════════════════════════
const DEF_SUP=[
  {id:"ml",  name:"Mercado Livre",site:"mercadolivre.com.br", url:"https://lista.mercadolivre.com.br/{q}",              type:"Nacional",     country:"Brasil",cur:"BRL",on:true, note:"Maior marketplace do Brasil"},
  {id:"amz", name:"Amazon BR",   site:"amazon.com.br",        url:"https://www.amazon.com.br/s?k={q}",                   type:"Nacional",     country:"Brasil",cur:"BRL",on:true, note:"Amazon Brasil"},
  {id:"shp", name:"Shopee",      site:"shopee.com.br",        url:"https://shopee.com.br/search?keyword={q}",            type:"Nacional",     country:"Brasil",cur:"BRL",on:true, note:"Crescimento acelerado"},
  {id:"mag", name:"Magalu",      site:"magazineluiza.com.br", url:"https://www.magazineluiza.com.br/busca/{q}/",          type:"Nacional",     country:"Brasil",cur:"BRL",on:true, note:"Grande varejista"},
  {id:"ali", name:"AliExpress",  site:"aliexpress.com",       url:"https://www.aliexpress.com/wholesale?SearchText={q}", type:"Internacional",country:"China", cur:"USD",on:true, note:"Varejo chinês"},
  {id:"alib",name:"Alibaba",     site:"alibaba.com",          url:"https://www.alibaba.com/trade/search?SearchText={q}", type:"Internacional",country:"China", cur:"USD",on:false,note:"Atacado B2B"},
  {id:"amzu",name:"Amazon USA",  site:"amazon.com",           url:"https://www.amazon.com/s?k={q}",                      type:"Internacional",country:"EUA",  cur:"USD",on:false,note:"Amazon americana"},
];
const DEF_SET={usd:0,eur:0,cny:0,freight:25,margin:30,
  rateSource:"",rateTime:"",rateTimestamp:0,
  usdRateSource:"",eurRateSource:"",cnyRateSource:"",
  usdRateTime:"",eurRateTime:"",cnyRateTime:"",
  usdRateTimestamp:0,eurRateTimestamp:0,cnyRateTimestamp:0,
  usdWarning:null,eurWarning:null,cnyWarning:null};

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
const ST={
  suppliers:LS.g("piq_sup",DEF_SUP),
  settings: LS.g("piq_set",DEF_SET),
  history:  LS.g("piq_hist",[]),
  saved:    LS.g("piq_saved",[]),
  query:"",selIds:[],results:[],meta:null,insight:null,
  searching:false,aiLoading:false,
  progDone:0,progTotal:0,progCur:"",
  expandId:null,manualFormId:null,assistedTab:"text",view:"home",
  sfMode:null,sfId:null,sfData:null,
  rateLoading:false,
  searchErrors:[]
};

function persist(){
  LS.s("piq_sup",ST.suppliers);
  LS.s("piq_set",ST.settings);
  LS.s("piq_hist",ST.history);
  LS.s("piq_saved",ST.saved);
}

// ══════════════════════════════════════════════════════
// MIGRAÇÃO — garante que todos os fornecedores tenham url/site válidos
// (versões antigas podem ter salvo sem o campo url no localStorage)
// ══════════════════════════════════════════════════════
function migrateSuppliers(){
  const KNOWN_URLS={
    "mercadolivre.com.br":"https://lista.mercadolivre.com.br/{q}",
    "amazon.com.br":"https://www.amazon.com.br/s?k={q}",
    "amazon.com":"https://www.amazon.com/s?k={q}",
    "shopee.com.br":"https://shopee.com.br/search?keyword={q}",
    "magazineluiza.com.br":"https://www.magazineluiza.com.br/busca/{q}/",
    "aliexpress.com":"https://www.aliexpress.com/wholesale?SearchText={q}",
    "alibaba.com":"https://www.alibaba.com/trade/search?SearchText={q}",
    "americanas.com.br":"https://www.americanas.com.br/busca/{q}",
    "submarino.com.br":"https://www.submarino.com.br/busca/{q}",
    "casasbahia.com.br":"https://www.casasbahia.com.br/busca/{q}",
  };
  let changed=false;
  ST.suppliers=(ST.suppliers||[]).filter(s=>s&&typeof s==="object").map(s=>{
    const out={...s};
    if(!out.id)out.id="sup"+Date.now()+Math.random().toString(36).slice(2,6);
    if(!out.name)out.name=out.site||"Fornecedor";
    if(!out.cur)out.cur="BRL";
    if(!out.country)out.country="Brasil";
    if(!out.type)out.type="Nacional";
    if(typeof out.on!=="boolean")out.on=true;
    // Campo crítico: site
    if(!out.site&&out.url){
      const m=String(out.url).match(/https?:\/\/([^\/]+)/);
      if(m)out.site=m[1].replace(/^www\./,"");
    }
    if(!out.site)out.site="";
    // Campo crítico: url
    if(!out.url||typeof out.url!=="string"||!out.url.includes("{q}")){
      const siteKey=String(out.site||"").replace(/^www\./,"").toLowerCase();
      out.url=KNOWN_URLS[siteKey]||(out.site?`https://${out.site}/search?q={q}`:"");
      changed=true;
    }
    // ── AI Search Agent: campos novos com defaults sãos ──
    if(!Array.isArray(out.catalog))out.catalog=[];
    if(typeof out.supportsPublicSearch!=="boolean")out.supportsPublicSearch=true;
    if(typeof out.requiresLogin!=="boolean")out.requiresLogin=false;
    if(!out.collectionMode)out.collectionMode="agent";
    if(!Array.isArray(out.allowedMethods)||!out.allowedMethods.length){
      out.allowedMethods=["catalog","saved_results","public_connector","assisted","text_paste","link_paste","manual"];
      changed=true;
    }
    return out;
  }).filter(s=>s.site||s.url);
  if(changed)persist();
}
migrateSuppliers();

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmt(n){return typeof n==="number"?n.toFixed(2):String(n||"0.00")}
function fmt4(n){return typeof n==="number"?n.toFixed(4):String(n||"0.0000")}
function fmtDate(iso){try{return new Date(iso).toLocaleString("pt-BR")}catch{return iso||""}}
// ══════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════
let _toastT=null;
function toast(msg,type="ok"){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.style.background=type==="ok"?"#00C48C":"#FF4D6D";
  el.style.color="#fff";el.style.display="flex";
  clearTimeout(_toastT);
  _toastT=setTimeout(()=>{el.style.display="none"},3500);
}

// ══════════════════════════════════════════════════════
// BOTTOM SHEET
// ══════════════════════════════════════════════════════
function openSheet(html){
  document.getElementById("sheet").innerHTML=html;
  document.getElementById("sheet").classList.remove("hidden");
  document.getElementById("overlay").classList.remove("hidden");
}
function closeSheet(){
  document.getElementById("sheet").classList.add("hidden");
  document.getElementById("overlay").classList.add("hidden");
}

// ══════════════════════════════════════════════════════
// NAV
// ══════════════════════════════════════════════════════
function nav(v){
  ["home","suppliers","history","settings","results"].forEach(p=>{
    document.getElementById("page-"+p).classList.toggle("hidden",p!==v);
  });
  ["home","suppliers","history","settings"].forEach(p=>{
    const b=document.getElementById("nb-"+p);
    if(b)b.className="nb"+(p===v?" on":"");
  });
  ST.view=v;
  if(v==="home")      renderHome();
  if(v==="suppliers") renderSuppliers();
  if(v==="history")   renderHistory();
  if(v==="settings")  renderSettings();
  if(v==="results")   renderResults();
}

// ══════════════════════════════════════════════════════
// ICONS
// ══════════════════════════════════════════════════════
const ico={
  search:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  zap:`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`,
  pkg:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`,
  save:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>`,
  share:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,

function parseJson(raw){
  if(!raw)return null;
  let m=raw.match(/```json\s*([\s\S]*?)```/i);
  if(m){try{return JSON.parse(m[1].trim())}catch{}}
  m=raw.match(/```\s*([\s\S]*?)```/);
  if(m){try{return JSON.parse(m[1].trim())}catch{}}
  const s=raw.indexOf("{"),e=raw.lastIndexOf("}");
  if(s>-1&&e>s){
    try{return JSON.parse(raw.slice(s,e+1))}catch{}
    try{return JSON.parse(raw.slice(s,e+1).replace(/,\s*([}\]])/g,"$1"))}catch{}
  }
  return null;
}

// TAREFA 1 — COTAÇÃO REAL DE MOEDAS (Yahoo Finance, atualiza a cada 1min)
// ══════════════════════════════════════════════════════
const RATE_TTL=60000; // 1 minuto em ms

// Faixas plausíveis por moeda — sanity check para descartar números errados
// extraídos da página (variação, gráfico, % etc.). Só aceita valores nesse range.
const RATE_RANGES={
  USD:[3.0,10.0],
  EUR:[4.0,12.0],
  CNY:[0.3,2.0],
};

// Parse robusto de número Investing (BR ou EN-US)
function parseInvestingNum(raw){
  if(!raw)return NaN;
  raw=String(raw).trim();
  if(raw.includes(",")&&raw.includes(".")){
    const lc=raw.lastIndexOf(","),ld=raw.lastIndexOf(".");
    if(lc>ld)return parseFloat(raw.replace(/\./g,"").replace(",","."));
    return parseFloat(raw.replace(/,/g,""));
  }
  if(raw.includes(","))return parseFloat(raw.replace(",","."));
  return parseFloat(raw);
}

// Tira scripts/styles/tags do HTML, devolve texto visível
function cleanVisibleText(html){
  if(!html)return"";
  return html
    .replace(/<script[\s\S]*?<\/script>/gi," ")
    .replace(/<style[\s\S]*?<\/style>/gi," ")
    .replace(/<noscript[\s\S]*?<\/noscript>/gi," ")
    .replace(/<[^>]+>/g," ")
    .replace(/&nbsp;/gi," ").replace(/&amp;/gi,"&")
    .replace(/&lt;/gi,"<").replace(/&gt;/gi,">")
    .replace(/&#39;/gi,"'").replace(/&quot;/gi,'"')
    .replace(/\s+/g," ").trim();
}

// Fallback de texto visível p/ Investing (crítico p/ USD quando DOM não vem)
// Aplica sanity range — descarta números fora da faixa esperada
function extractPriceFromVisibleText(html,range,pair){
  if(!html)return null;
  const text=cleanVisibleText(html);
  if(text.length<30)return null;
  const slash=pair.toUpperCase()+"\\/BRL";
  const patterns=[
    new RegExp("current\\s+"+slash+"\\s+exchange\\s+rate\\s+is\\s+([\\d.,]+)","i"),
    new RegExp("bid\\s+price\\s+is\\s+([\\d.,]+)\\s+and\\s+the\\s+ask\\s+price\\s+is\\s+[\\d.,]+\\s+for\\s+"+slash,"i"),
    new RegExp(slash+"[\\s\\S]{0,260}?Real-time\\s+Currencies[\\s\\S]{0,180}?(\\d+[.,]\\d{3,6})","i"),
    new RegExp("Real-time\\s+Currencies[\\s\\S]{0,260}?"+slash+"[\\s\\S]{0,120}?(\\d+[.,]\\d{3,6})","i"),
  ];
  for(const p of patterns){
    const m=text.match(p);
    if(!m||!m[1])continue;
    const num=parseInvestingNum(m[1]);
    if(num>=range[0]&&num<=range[1])return num;
  }
  return null;
}

async function fetchInvestingRate(pair){
  const code=pair.toUpperCase();
  const slug=pair.toLowerCase()+"-brl";
  const range=RATE_RANGES[code]||[0.01,100];
  // 6 hosts/slugs — Investing tem múltiplas páginas para o mesmo par.
  // USD/BRL é o par mais acessado do mundo; cache dos proxies satura.
  // Usar mais variações = mais chance de pegar um cache não-saturado.
  const hosts=[
    "https://www.investing.com/currencies/"+slug,
    "https://br.investing.com/currencies/"+slug,
    "https://m.investing.com/currencies/"+slug,
    // Páginas alternativas da Investing que ainda têm o preço em destaque:
    "https://www.investing.com/currencies/"+slug+"-historical-data",
    "https://www.investing.com/currencies/"+slug+"-technical",
    "https://www.investing.com/currencies/"+slug+"-streaming-chart",
  ];
  // 5 proxies CORS — adicionados thingproxy + cors.lol como reforço.
  // Cada proxy tem seu próprio rate limit; mais proxies = mais headroom p/ USD.
  const proxies=[
    u=>"https://corsproxy.io/?"+encodeURIComponent(u),
    u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
    u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),
    u=>"https://api.cors.lol/?url="+encodeURIComponent(u),
    u=>"https://thingproxy.freeboard.io/fetch/"+u,
  ];
  // Cache buster com timestamp + random — força miss no cache dos proxies
  const buster=()=>"_t="+Date.now()+"_r="+Math.random().toString(36).slice(2,8);
  // Race em paralelo: 6 hosts × 5 proxies = 30 tentativas simultâneas
  const attempts=[];
  const failures=[];
  for(const host of hosts){
    for(const mkProxy of proxies){
      attempts.push((async()=>{
        const proxyUrl=mkProxy(host+"?"+buster());
        try{
          const r=await fetch(proxyUrl,{cache:"no-store",signal:AbortSignal.timeout(7000)});
          if(!r.ok){failures.push(code+" "+host.split("/").pop()+" via "+proxyUrl.split("?")[0]+" → HTTP "+r.status);throw new Error("HTTP "+r.status);}
          const html=await r.text();
          // 1) DOM/JSON patterns (rápido + preciso quando o conteúdo é completo)
          const domPatterns=[
            /data-test=["']instrument-price-last["'][^>]*>\s*([\d.,]+)\s*</i,
            /"last":\s*"?([\d.]+)"?\s*[,}]/,
            /"regularMarketPrice":\s*([\d.]+)/,
            /"last_close":\s*"?([\d.]+)"?/,
            // Padrões adicionais que algumas páginas usam (historical-data, technical)
            /pid-\d+-last[^>]*>\s*([\d.,]+)\s*</i,
            /id=["']last_last["'][^>]*>\s*([\d.,]+)\s*</i,
            /class=["'][^"']*text-2xl[^"']*["'][^>]*>\s*([\d.,]+)\s*</i,
            /"lastPrice":\s*"?([\d.]+)"?/,
            /"price":\s*"?([\d.]+)"?\s*[,}]/,
          ];
          for(const p of domPatterns){
            const m=html.match(p);
            if(!m)continue;
            const num=parseInvestingNum(m[1]);
            if(num>=range[0]&&num<=range[1])return num;
          }
          // 2) Fallback texto visível
          const fromText=extractPriceFromVisibleText(html,range,pair);
          if(fromText!==null)return fromText;
          failures.push(code+" "+host.split("/").pop()+" via "+proxyUrl.split("?")[0]+" → HTML sem preço ("+html.length+"b)");
          throw new Error("preço não encontrado");
        }catch(e){
          failures.push(code+" "+host.split("/").pop()+" via "+proxyUrl.split("?")[0]+" → "+e.message);
          throw e;
        }
      })());
    }
  }
  try{
    const v=await Promise.any(attempts);
    return v;
  }catch(e){
    // Loga TODAS as falhas pro DevTools — facilita diagnosticar exatamente o que aconteceu
    console.warn("[Investing "+code+"] todas as "+attempts.length+" tentativas falharam:");
    failures.slice(0,15).forEach(f=>console.warn("  · "+f));
    throw new Error("Investing.com falhou para "+pair+" ("+attempts.length+" tentativas)");
  }
}

// Cotação: somente Investing.com. Sem AwesomeAPI, sem manual, sem IA.
// Se uma moeda falhar: mantém o último valor AUTOMÁTICO salvo (rateSource==="Investing.com") e mostra aviso.
// Valores manuais legados (rateSource==="manual") são ignorados como fonte.
async function fetchLiveRates(force=false){
  const s=ST.settings;
  const nowMs=Date.now();

  // Cache por moeda — só valida se o último valor for da Investing.
  function freshOf(pair){
    const tsKey=pair+"RateTimestamp",srcKey=pair+"RateSource";
    const ts=s[tsKey]||0;
    if(ts<=0)return false;
    if(s[srcKey]!=="Investing.com")return false;
    const val=s[pair];
    if(!(val>0))return false;
    return (nowMs-ts)<RATE_TTL;
  }
  if(!force && freshOf("usd") && freshOf("eur") && freshOf("cny")){
    updateNavRateSub();
    return {usd:s.usd,eur:s.eur,cny:s.cny,source:"Investing.com",time:s.rateTime,fromCache:true,partial:false,warnings:{usd:null,eur:null,cny:null}};
  }

  ST.rateLoading=true;
  updateNavRateSub();

  const errs={USD:null,EUR:null,CNY:null};
  const [usdR,eurR,cnyR]=await Promise.all([
    fetchInvestingRate("USD").catch(e=>{errs.USD=e.message;console.warn("[Investing USD]",e.message);return null;}),
    fetchInvestingRate("EUR").catch(e=>{errs.EUR=e.message;console.warn("[Investing EUR]",e.message);return null;}),
    fetchInvestingRate("CNY").catch(e=>{errs.CNY=e.message;console.warn("[Investing CNY]",e.message);return null;}),
  ]);

  const okUsd=usdR>1, okEur=eurR>1, okCny=cnyR>0;
  const now=Date.now();
  const timeStr=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});

  // Para cada moeda: se sucesso → atualiza valor + timestamp + source="Investing.com".
  // Se falha → mantém último valor automático salvo (se source anterior for Investing.com).
  function pickValue(pair,fresh,fallbackValue){
    if(fresh)return parseFloat(fresh.toFixed(4));
    const src=s[pair+"RateSource"];
    const prev=s[pair];
    if(prev>0 && src==="Investing.com")return prev;
    return fallbackValue;
  }
  const newUsd=pickValue("usd",okUsd?usdR:null,null);
  const newEur=pickValue("eur",okEur?eurR:null,null);
  const newCny=pickValue("cny",okCny?cnyR:null,null);

  function warnOf(pair,ok,errMsg,finalVal){
    if(ok)return null;
    if(finalVal>0)return `${pair.toUpperCase()}/BRL — Investing.com indisponível, exibindo último valor automático`;
    return `${pair.toUpperCase()}/BRL — Investing.com indisponível (${errMsg||"sem detalhe"})`;
  }
  const usdWarning=warnOf("usd",okUsd,errs.USD,newUsd);
  const eurWarning=warnOf("eur",okEur,errs.EUR,newEur);
  const cnyWarning=warnOf("cny",okCny,errs.CNY,newCny);

  ST.settings={...ST.settings,
    usd:newUsd!=null?newUsd:s.usd,
    eur:newEur!=null?newEur:s.eur,
    cny:newCny!=null?newCny:s.cny,
    rateSource:"Investing.com",
    rateTime:timeStr,
    rateTimestamp:now,
    usdRateSource: okUsd?"Investing.com":(s.usdRateSource||""),
    eurRateSource: okEur?"Investing.com":(s.eurRateSource||""),
    cnyRateSource: okCny?"Investing.com":(s.cnyRateSource||""),
    usdRateTime: okUsd?timeStr:(s.usdRateTime||"—"),
    eurRateTime: okEur?timeStr:(s.eurRateTime||"—"),
    cnyRateTime: okCny?timeStr:(s.cnyRateTime||"—"),
    usdRateTimestamp: okUsd?now:(s.usdRateTimestamp||0),
    eurRateTimestamp: okEur?now:(s.eurRateTimestamp||0),
    cnyRateTimestamp: okCny?now:(s.cnyRateTimestamp||0),
    usdWarning,eurWarning,cnyWarning,
  };
  persist();
  ST.rateLoading=false;
  updateNavRateSub();

  return{
    usd:ST.settings.usd,eur:ST.settings.eur,cny:ST.settings.cny,
    source:"Investing.com",time:timeStr,
    fromCache:false,
    partial:!(okUsd&&okEur&&okCny),
    warnings:{usd:usdWarning,eur:eurWarning,cny:cnyWarning},
  };
}

function updateNavRateSub(){
  const el=document.getElementById("nav-rate-sub");
  if(!el)return;
  const s=ST.settings;
  if(ST.rateLoading){el.textContent="Atualizando cotações…";return;}
  if(s.rateTime&&s.usd>0){
    el.textContent=`USD ${fmt4(s.usd)} · ${s.rateTime}`;
  } else {
    el.textContent="Comparador com IA";
  }
}

function rateAge(){
  const ts=ST.settings.rateTimestamp||0;
  if(!ts)return"nunca atualizado";
  const mins=Math.floor((Date.now()-ts)/60000);
  if(mins<2)return"agora mesmo";
  if(mins<60)return`${mins} min atrás`;
  return`${Math.floor(mins/60)}h atrás`;
}

// MOTOR DE BUSCA DE PREÇOS — PriceIQ Search Engine (sem IA)
// ══════════════════════════════════════════════════════════════════════
// Arquitetura em camadas (todas concretas e testáveis):
//   1. SearchStatus    — enum dos estados possíveis de cada resultado
//   2. textUtils       — normalização (acento, GB, vírgula/ponto)
//   3. ProductMatcher  — score 0-100 + filtro de acessórios/negativos
//   4. PriceValidator  — faixa plausível + evidência obrigatória
//   5. LinkValidator   — domínio do fornecedor + padrão real de produto
//   6. UrlBuilder      — URL de busca real do fornecedor (sempre disponível)
//   7. Fetchers        — Jina Reader, CORS proxy (erros traduzidos)
//   8. ResultParser    — JSON-LD + markdown + URL próxima
//   9. ResultValidator — porta final: define o status do resultado
//  10. SearchEngine    — orquestrador fornecedor por fornecedor
//
// Garantias:
//   - NUNCA inventa produto, preço, vendedor, frete ou link.
//   - Todo resultado tem SearchStatus e razão clara.
//   - Quando não dá pra validar → manda para busca manual real.
// ══════════════════════════════════════════════════════════════════════

// ── 1. textUtils ────────────────────────────────────────────────
function normText(s){
  return (s||"").toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9\s]/g," ")
    .replace(/(\d+)\s*(gb|tb|mb|kb)\b/g,"$1$2")
    .replace(/\s+/g," ").trim();
}
function tokenize(s){return normText(s).split(" ").filter(t=>t.length>=2);}

// Palavras negativas: se aparecerem no nome e o usuário NÃO buscou acessório, descarta
const NEGATIVE_TOKENS=[
  "capa","capinha","case","cover","pelicula","película","protetor","cabo","carregador","fonte",
  "adaptador","suporte","bateria extra","fone","headset","earphone","kit","compativel","compativel com",
  "similar","replica","réplica","generico","genérico","usado","seminovo","recondicionado","refurbished",
  "renewed","peca","peça","apenas o","somente a"
];
const ACCESSORY_SEARCH_HINTS=["capa","capinha","case","cover","pelicula","película","cabo","carregador","fone","adaptador","suporte"];

// ── 2. ProductMatcher ───────────────────────────────────────────
function analyzeQuery(query){
  const original=String(query||"");
  const normalized=normText(original);
  const tokens=tokenize(original);
  const isAccessorySearch=ACCESSORY_SEARCH_HINTS.some(h=>normalized.includes(h));
  // Specs (número+unidade) são obrigatórias — não podem faltar
  const specs=[];
  const specRx=/\b(\d+)(gb|tb|mb|polegadas?|pol|mm|cm|kg|w|v|hz)\b/g;
  let m; while((m=specRx.exec(normalized))!==null) specs.push(m[0]);
  return{original,normalized,tokens,specs,isAccessorySearch};
}
function scoreProduct(queryMeta,candidateName){
  const name=String(candidateName||"");
  const nameNorm=normText(name);
  const nameTokens=tokenize(name);
  let score=0,isNegative=false,isLikelyAccessory=false;
  const missingSpecs=[];
  if(!queryMeta.isAccessorySearch){
    for(const neg of NEGATIVE_TOKENS){
      const nn=normText(neg);
      // Se o usuário buscou esse termo na query, não conta como negativo
      if(queryMeta.tokens.includes(nn))continue;
      // Multi-word: usa includes; single-word: exige token inteiro (evita "fone" casando em "fonte")
      const isMulti=nn.includes(" ");
      const hit=isMulti?nameNorm.includes(nn):nameTokens.includes(nn);
      if(hit){isNegative=true;isLikelyAccessory=true;break;}
    }
  }
  const matchedTokens=queryMeta.tokens.filter(t=>nameTokens.includes(t)).length;
  const tokenRatio=queryMeta.tokens.length?matchedTokens/queryMeta.tokens.length:0;
  score=Math.round(tokenRatio*70);
  if(queryMeta.specs.length){
    let specHits=0;
    for(const sp of queryMeta.specs){
      if(nameNorm.includes(sp)) specHits++;
      else missingSpecs.push(sp);
    }
    score+=Math.round((specHits/queryMeta.specs.length)*30);
    if(missingSpecs.length) score=Math.max(0,score-15*missingSpecs.length);
  }else{
    if(tokenRatio>=0.7) score+=20;
  }
  if(isNegative) score=Math.min(score,30);
  return{score:Math.max(0,Math.min(100,score)),isLikelyAccessory,isNegative,missingSpecs};
}

// ── 3. PriceValidator ───────────────────────────────────────────
const PRICE_RANGES={BRL:[5,500000],USD:[1,100000],EUR:[1,100000],CNY:[3,500000]};
function isPlausiblePrice(price,currency){
  const r=PRICE_RANGES[currency]||[1,1000000];
  return Number.isFinite(price)&&price>=r[0]&&price<=r[1];
}
function priceLooksSuspicious(price,currency,queryMeta){
  const expensiveHints=["iphone","macbook","ipad","airpods","ps5","playstation","xbox","notebook","celular","smartphone","tv "];
  const looksExpensive=expensiveHints.some(h=>queryMeta.normalized.includes(h));
  if(!looksExpensive) return false;
  if(currency==="BRL"&&price<200) return true;
  if((currency==="USD"||currency==="EUR")&&price<50) return true;
  if(currency==="CNY"&&price<200) return true;
  return false;
}
function parseBRPrice(s){return parseFloat((s||"").replace(/\./g,"").replace(",","."))}
function parseENPrice(s){return parseFloat((s||"").replace(/,/g,""))}

// ── 4. LinkValidator ───────────────────────────────────────────
const PRODUCT_URL_PATTERNS=[
  /\/MLB-?\d{6,}/i,/\/p\/MLB\d{6,}/i,/\/dp\/[A-Z0-9]{10}/,/\/gp\/product\/[A-Z0-9]{10}/,
  /-i\.\d{5,}\.\d{5,}/,/\/p\/[a-z0-9]{6,}[\/.]/i,/\/item\/\d{6,}/,/\/product-detail\//i,
  /\/produto\//i,/\/products\/[^\/]+/i
];
const SEARCH_URL_PATTERNS=[/\/(search|busca|s\?|find|q=|wholesale|category|categoria)/i];
function classifyLink(url,supplierSite){
  if(!url||!/^https?:\/\//.test(url)) return{type:"invalid",validated:false};
  const siteNoWww=String(supplierSite||"").replace(/^https?:\/\//,"").replace(/^www\./,"").toLowerCase();
  if(!siteNoWww) return{type:"invalid",validated:false};
  let host; try{host=new URL(url).host.toLowerCase()}catch{return{type:"invalid",validated:false}}
  if(!host.endsWith(siteNoWww)&&!host.includes(siteNoWww)) return{type:"invalid",validated:false};
  if(PRODUCT_URL_PATTERNS.some(p=>p.test(url))) return{type:"product",validated:true};
  if(SEARCH_URL_PATTERNS.some(p=>p.test(url))) return{type:"search",validated:true};
  return{type:"unverified",validated:false};
}

// ── 5. UrlBuilder ──────────────────────────────────────────────
// IMPORTANTE: sem fallback cego /search?q=. Se o fornecedor não tem
// template válido com {q}, retorna "" — o card avisa para editar.
function buildSearchUrl(supplier,query){
  const supUrl=String(supplier.url||"").trim();
  if(supUrl&&supUrl.includes("{q}")) return supUrl.replace("{q}",encodeURIComponent(query));
  return"";
}

// ── 6. Fetchers ────────────────────────────────────────────────
async function fetchViaJina(url){
  const endpoint="https://r.jina.ai/"+url;
  const r=await fetch(endpoint,{
    headers:{"Accept":"text/plain","X-Return-Format":"text","X-Timeout":"15"},
    signal:AbortSignal.timeout(20000)
  });
  if(!r.ok){
    if(r.status===451||r.status===403||r.status===429){
      const e=new Error("Fornecedor bloqueou leitura automática");e.siteBlocked=true;throw e;
    }
    throw new Error("Conteúdo indisponível (HTTP "+r.status+")");
  }
  return(await r.text()).slice(0,16000);
}
async function fetchViaCorsProxy(url){
  const proxies=[
    u=>"https://corsproxy.io/?"+encodeURIComponent(u),
    u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
  ];
  for(const mk of proxies){
    try{
      const r=await fetch(mk(url+"?_t="+Date.now()),{signal:AbortSignal.timeout(15000),cache:"no-store"});
      if(!r.ok) continue;
      const txt=await r.text();
      if(txt&&txt.length>=200) return txt.slice(0,200000);
    }catch{}
  }
  const e=new Error("Fornecedor bloqueou leitura automática");e.siteBlocked=true;throw e;
}

// ── 7. ResultParser ────────────────────────────────────────────
function looksLikeNonPriceCtx(content,pos,matchLen){
  const before=content.slice(Math.max(0,pos-60),pos).toLowerCase();
  const after=content.slice(pos+matchLen,Math.min(content.length,pos+matchLen+30)).toLowerCase();
  if(/\b(avalia[cç][aã]o|review|nota|estrelas?|rating)\b[^\d]{0,8}$/.test(before)) return true;
  if(/^\s*(estrelas?|de\s+5|avalia[cç][oõ]es|reviews?)/.test(after)) return true;
  if(/^\s*(vendidos?|unidades?\s+vendidas?|sold)/.test(after)) return true;
  if(/^\s*(gb|mb|tb|kb|mm|cm|kg|g\b|ml|l\b|w\b|v\b|hz|fps|polegadas|inch|ano|year)\b/.test(after)) return true;
  if(/\d+\s*x\s*$/.test(before)) return true;
  return false;
}
function findPrices(content,currency){
  const patterns=[];
  if(currency==="BRL") patterns.push({rx:/R\$\s*([\d.]+(?:,\d{1,2})?)/g,parse:parseBRPrice});
  else if(currency==="USD"){
    patterns.push({rx:/(?:US\$|USD)\s*([\d,]+(?:\.\d{1,2})?)/g,parse:parseENPrice});
    patterns.push({rx:/\$\s*([\d,]+\.\d{1,2})/g,parse:parseENPrice});
  } else if(currency==="EUR"){
    patterns.push({rx:/€\s*([\d.]+(?:,\d{1,2})?)/g,parse:parseBRPrice});
    patterns.push({rx:/EUR\s*([\d.]+(?:,\d{1,2})?)/g,parse:parseBRPrice});
  } else if(currency==="CNY"){
    patterns.push({rx:/¥\s*([\d,]+(?:\.\d{1,2})?)/g,parse:parseENPrice});
    patterns.push({rx:/CNY\s*([\d,]+(?:\.\d{1,2})?)/g,parse:parseENPrice});
  }
  const out=[],seen=new Set();
  for(const{rx,parse}of patterns){
    rx.lastIndex=0; let m;
    while((m=rx.exec(content))!==null){
      const raw=m[1]; if(!raw) continue;
      const v=parse(raw);
      if(!isPlausiblePrice(v,currency)) continue;
      if(looksLikeNonPriceCtx(content,m.index,m[0].length)) continue;
      const k=`${currency}:${v}:${m.index}`;
      if(seen.has(k)) continue;
      seen.add(k);
      out.push({value:v,currency,text:m[0],position:m.index});
    }
  }
  return out;
}
function findProductUrls(content,supplierSite){
  const siteNoWww=String(supplierSite||"").replace(/^www\./,"").toLowerCase();
  if(!siteNoWww) return[];
  const esc=siteNoWww.replace(/\./g,"\\.");
  const rx=new RegExp("https?:\\/\\/(?:[a-z0-9-]+\\.)*"+esc+"\\/[^\\s)\"'<>\\]]+","gi");
  const all=content.match(rx)||[];
  const out=[];
  for(const raw of all){
    const clean=raw.replace(/[).,;:!?\]]+$/,"");
    if(SEARCH_URL_PATTERNS.some(p=>p.test(clean))) continue;
    if(PRODUCT_URL_PATTERNS.some(p=>p.test(clean))) out.push(clean);
  }
  return[...new Set(out)];
}
function cleanLine(raw){
  return raw.replace(/^[#*\-\s|>]+/,"").replace(/!\[(.*?)\]\(.*?\)/g,"$1").replace(/\[(.*?)\]\(.*?\)/g,"$1").trim();
}
function isUsableNameLine(cl){
  if(cl.length<6||cl.length>240) return false;
  if(/^https?:\/\//i.test(cl)) return false;
  if(/^(ver|comprar|adicionar|mais|detalhes?|produto|imagem|frete|envio)\b/i.test(cl)) return false;
  if(/^(R\$|US\$|USD|EUR|€|¥|CNY)\s*[\d.,]+/i.test(cl)) return false;
  return true;
}
// Janela reduzida a 200 chars antes do preço. Exige match forte de tokens.
// Se 2+ linhas diferentes batem o critério, retorna null (ambíguo).
function findNameNear(content,position,queryMeta){
  const slice=content.slice(Math.max(0,position-200),position);
  const lines=slice.split("\n").map(l=>l.trim()).filter(Boolean);
  const totalTokens=queryMeta.tokens.length||1;
  // Exige pelo menos 75% dos tokens (mínimo 2 quando há 2+ tokens)
  const minMatch=totalTokens>=2?Math.max(2,Math.ceil(totalTokens*0.75)):1;
  const found=[];
  for(let i=lines.length-1;i>=0;i--){
    const cl=cleanLine(lines[i]||"");
    if(!isUsableNameLine(cl)) continue;
    const cln=normText(cl);
    const matched=queryMeta.tokens.filter(t=>cln.includes(t)).length;
    if(matched>=minMatch) found.push(cl.slice(0,200));
    if(found.length>=3) break;
  }
  if(found.length===0) return null;
  const unique=[...new Set(found)];
  if(unique.length>1) return null; // ambíguo: 2+ títulos diferentes batem
  return unique[0];
}
// Detecção LOCAL: janela de ±150 chars ao redor do preço.
// Se houver "frete grátis" E valor numérico na mesma janela → ambíguo (não encontrado).
function detectFreight(content,position,currency){
  if(!content||typeof position!=="number") return{freight:0,freightNote:"não encontrado"};
  const start=Math.max(0,position-150);
  const end=Math.min(content.length,position+150);
  const snippet=content.slice(start,end);
  const hasFree=/(frete\s+gr[áa]tis|free\s+shipping|envio\s+gr[áa]tis)/i.test(snippet);
  const sym=currency==="BRL"?"R\\$":currency==="USD"?"(?:US\\$|USD|\\$)":currency==="EUR"?"(?:€|EUR)":"(?:¥|CNY)";
  const m=snippet.match(new RegExp("(?:frete|shipping|envio)[^\\d]{0,30}"+sym+"\\s*([\\d.,]+)","i"));
  let valued=null;
  if(m&&m[1]){
    const v=currency==="BRL"||currency==="EUR"?parseBRPrice(m[1]):parseENPrice(m[1]);
    if(Number.isFinite(v)&&v>0&&v<5000) valued=v;
  }
  if(hasFree&&valued!==null) return{freight:0,freightNote:"não encontrado"}; // ambíguo
  if(hasFree) return{freight:0,freightNote:"grátis confirmado"};
  if(valued!==null) return{freight:valued,freightNote:"real encontrado"};
  return{freight:0,freightNote:"não encontrado"};
}
function extractJsonLd(content,supplier){
  const expectedCur=String(supplier.cur||"BRL").toUpperCase();
  const rx=/<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi;
  const out=[]; let m;
  while((m=rx.exec(content))!==null){
    const raw=(m[1]||"").trim(); if(!raw) continue;
    let parsed; try{parsed=JSON.parse(raw)}catch{continue}
    const flat=n=>{
      if(Array.isArray(n)) return n.flatMap(flat);
      if(n&&typeof n==="object"){const a=[n];if(n["@graph"]) a.push(...flat(n["@graph"]));return a;}
      return[];
    };
    for(const node of flat(parsed)){
      if(!node||typeof node!=="object") continue;
      const t=node["@type"];
      if(t!=="Product"&&!(Array.isArray(t)&&t.includes("Product"))) continue;
      const name=typeof node["name"]==="string"?node["name"].trim():"";
      if(!name||name.length<3) continue;
      const offers=node["offers"];
      const list=Array.isArray(offers)?offers:(offers?[offers]:[]);
      for(const off of list){
        if(!off||typeof off!=="object") continue;
        const pr=off["price"]??off["lowPrice"];
        const cur=String(off["priceCurrency"]??expectedCur).toUpperCase();
        if(cur!==expectedCur) continue;
        const price=typeof pr==="number"?pr:parseFloat(String(pr||"").replace(/,/g,"."));
        if(!isPlausiblePrice(price,cur)) continue;
        const url=String(node["url"]??off["url"]??"").trim();
        out.push({name:name.slice(0,200),price,currency:cur,url,
          evidence:`JSON-LD Product: ${name} — ${cur} ${price}`,
          freight:0,freightNote:"não encontrado",source:"json-ld"});
      }
    }
  }
  return out;
}
// Separa estritamente JSON-LD (estruturado) de markdown (heurístico).
// JSON-LD viável tem prioridade absoluta. Markdown nunca traz URL associada
// (a associação preço↔URL por proximidade no texto é inconfiável).
function parseContent(content,supplier,queryMeta){
  if(!content||content.length<200) return{status:SearchStatus.MANUAL_SEARCH,reason:"Conteúdo da página insuficiente"};
  const expectedCur=String(supplier.cur||"BRL").toUpperCase();

  // ── 1. JSON-LD: fonte estruturada (já filtra por priceCurrency==expectedCur) ──
  const jsonLdRaw=extractJsonLd(content,supplier);
  const scoredJsonLd=jsonLdRaw.map(c=>({...c,match:scoreProduct(queryMeta,c.name)}));
  const viableJsonLd=scoredJsonLd.filter(c=>c.match.score>=60&&!c.match.isNegative);

  if(viableJsonLd.length){
    viableJsonLd.sort((a,b)=>b.match.score-a.match.score||a.price-b.price);
    return{status:SearchStatus.VERIFIED,candidate:viableJsonLd[0]};
  }

  // ── 2. Markdown/texto livre: nunca leva URL direta de produto ──
  const prices=findPrices(content,expectedCur);
  const markdownCandidates=[];
  for(const p of prices){
    const name=findNameNear(content,p.position,queryMeta);
    if(!name) continue;
    const evS=Math.max(0,p.position-100),evE=Math.min(content.length,p.position+100);
    const snippet=content.slice(evS,evE).replace(/\s+/g," ").trim();
    const ship=detectFreight(content,p.position,expectedCur);
    markdownCandidates.push({name,price:p.value,currency:p.currency,
      url:"", // sem link direto — markdown não associa URL por proximidade
      evidence:snippet,freight:ship.freight,freightNote:ship.freightNote,source:"markdown"});
  }
  const scoredMd=markdownCandidates.map(c=>({...c,match:scoreProduct(queryMeta,c.name)}));
  const viableMd=scoredMd.filter(c=>c.match.score>=60&&!c.match.isNegative);

  // ── 3. Diagnósticos ──
  if(!scoredJsonLd.length&&!scoredMd.length){
    if(prices.length>0) return{status:SearchStatus.PRODUCT_NOT_FOUND,reason:"Preços na página, mas nenhum nome compatível encontrado"};
    return{status:SearchStatus.PRICE_NOT_FOUND,reason:"Sem preço da moeda esperada extraído com segurança"};
  }
  if(!viableJsonLd.length&&!viableMd.length){
    return{status:SearchStatus.PRODUCT_NOT_FOUND,reason:"Resultados encontrados são acessórios ou produtos diferentes"};
  }

  // ── 4. Só sobrou markdown → CHECK_DATA com aviso ──
  viableMd.sort((a,b)=>b.match.score-a.match.score||a.price-b.price);
  return{status:SearchStatus.CHECK_DATA,candidate:viableMd[0],
    reason:"Preço extraído por heurística do markdown — confira no site do fornecedor"};
}

// ── 8. ResultValidator (porta final) ──────────────────────────
// Regra invariante: somente JSON-LD pode atingir VERIFIED.
// Markdown sempre cai em CHECK_DATA com aviso explícito.
function finalizeResult(parseResult,supplier,queryMeta){
  // Statuses sem candidato: passa adiante
  if(parseResult.status===SearchStatus.PRICE_NOT_FOUND||
     parseResult.status===SearchStatus.PRODUCT_NOT_FOUND||
     parseResult.status===SearchStatus.MANUAL_SEARCH||
     parseResult.status===SearchStatus.BLOCKED||
     parseResult.status===SearchStatus.ERROR){
    return{status:parseResult.status,reason:parseResult.reason};
  }
  if(!parseResult.candidate){
    return{status:SearchStatus.PRODUCT_NOT_FOUND,reason:parseResult.reason||"Sem candidato válido"};
  }
  const c=parseResult.candidate;
  const linkInfo=classifyLink(c.url,supplier.site);

  // Preço suspeito (ex: R$ 13 num iPhone) → sempre CHECK_DATA
  if(priceLooksSuspicious(c.price,c.currency,queryMeta)){
    const li=linkInfo.type==="product"?linkInfo:{type:"search",validated:false};
    return{status:SearchStatus.CHECK_DATA,candidate:c,linkInfo:li,
      reason:`Preço suspeito (${c.currency} ${c.price}) — confira no site`};
  }

  // Origem markdown: NUNCA chega a VERIFIED. Sempre CHECK_DATA com aviso.
  if(c.source==="markdown"){
    return{status:SearchStatus.CHECK_DATA,candidate:c,linkInfo:{type:"search",validated:false},
      reason:c.match.score>=85
        ?"Match alto, mas extraído por heurística (sem dados estruturados) — confira no site"
        :`Heurística (match ${c.match.score}%) — confira no site`};
  }

  // Origem JSON-LD a partir daqui
  if(linkInfo.type==="invalid"){
    if(c.match.score>=75){
      return{status:SearchStatus.CHECK_DATA,candidate:c,linkInfo:{type:"search",validated:false},
        reason:"JSON-LD compatível, mas sem link direto validado"};
    }
    return{status:SearchStatus.PRODUCT_NOT_FOUND,reason:"Link inválido + match parcial"};
  }
  if(linkInfo.type==="search"||linkInfo.type==="unverified"){
    if(c.match.score>=75) return{status:SearchStatus.CHECK_DATA,candidate:c,linkInfo,
      reason:"Match alto, mas link é de busca/categoria"};
    return{status:SearchStatus.PRODUCT_NOT_FOUND,reason:"Link não é de produto e match não é alto"};
  }
  // linkInfo.type === "product"
  if(c.match.score>=85) return{status:SearchStatus.VERIFIED,candidate:c,linkInfo,reason:"Produto, preço e link validados via JSON-LD"};
  if(c.match.score>=60) return{status:SearchStatus.CHECK_DATA,candidate:c,linkInfo,reason:`Match parcial em JSON-LD (${c.match.score}%)`};
  return{status:SearchStatus.PRODUCT_NOT_FOUND,reason:`Match baixo (${c.match.score}%)`};
}

// ── 9. SearchEngine ─────────────────────────────────────────────
function searchDebugLog(supplier,info){console.log(`[PriceIQ:${supplier.name||"?"}]`,info);}

// Indicadores de bloqueio: CAPTCHA, Cloudflare, login obrigatório, anti-bot.
// Verificado SEMPRE antes de tentar parsear conteúdo.
const BLOCK_INDICATORS=[
  /\bcaptcha\b/i,
  /are you human/i,
  /access denied/i,
  /\bcloudflare\b/i,
  /please verify/i,
  /robot check/i,
  /verify you are human/i,
  /\bforbidden\b/i,
  /pardon our interruption/i,
  /unusual traffic/i,
  /unable to verify/i,
  /enable javascript and cookies to continue/i,
  /attention required/i,
  /security check/i,
  /faça login para continuar/i,
  /entre para continuar/i,
];
function looksBlocked(content){
  if(!content||content.length<50) return false;
  // Verifica apenas os primeiros 4KB (cabeça da página de bloqueio)
  const head=content.slice(0,4000);
  return BLOCK_INDICATORS.some(p=>p.test(head));
}

async function searchSupplier(query,supplier,queryMeta,set){
  const ts=new Date().toISOString();
  const searchUrl=buildSearchUrl(supplier,query);
  if(!searchUrl){
    return buildResultRecord(
      {status:SearchStatus.ERROR,reason:"Fornecedor sem URL de busca configurada — edite em Configurações"},
      query,supplier,set,ts,"");
  }
  let content="",blocked=false,fetchErr=null;
  try{content=await fetchViaJina(searchUrl)}catch(e){
    if(e.siteBlocked) blocked=true; else fetchErr=e.message;
    searchDebugLog(supplier,{phase:"jina",url:searchUrl,err:e.message});
  }
  if(!content&&!blocked){
    try{content=await fetchViaCorsProxy(searchUrl)}catch(e){
      if(e.siteBlocked) blocked=true; else fetchErr=e.message;
      searchDebugLog(supplier,{phase:"cors",err:e.message});
    }
  }
  if(blocked) return buildResultRecord({status:SearchStatus.BLOCKED,reason:"Fornecedor bloqueou leitura automática"},query,supplier,set,ts,searchUrl);
  if(!content) return buildResultRecord({status:SearchStatus.MANUAL_SEARCH,reason:fetchErr||"Sem conteúdo da página"},query,supplier,set,ts,searchUrl);
  // Guard de CAPTCHA/Cloudflare/login: nunca parsear página de bloqueio
  if(looksBlocked(content)){
    searchDebugLog(supplier,{url:searchUrl,blocked:true,reason:"conteúdo de bloqueio"});
    return buildResultRecord(
      {status:SearchStatus.BLOCKED,reason:"Página retornou conteúdo de bloqueio (CAPTCHA/Cloudflare/login)"},
      query,supplier,set,ts,searchUrl);
  }
  const parsed=parseContent(content,supplier,queryMeta);
  const final=finalizeResult(parsed,supplier,queryMeta);
  searchDebugLog(supplier,{url:searchUrl,status:final.status,matchScore:final.candidate?.match?.score,price:final.candidate?.price,reason:final.reason});
  return buildResultRecord(final,query,supplier,set,ts,searchUrl);
}

// Monta o registro padronizado que a UI consome
function buildResultRecord(final,query,supplier,set,ts,searchUrl){
  const c=final.candidate;
  const linkInfo=final.linkInfo||{type:"search",validated:false};
  const isProductLink=linkInfo.type==="product"&&linkInfo.validated;
  const supCur=String(supplier.cur||"BRL").toUpperCase();
  const cur=c?.currency||supCur;
  let priceBRL=null,freightBRL=0,brl=null,rateUsed=1;
  if(c&&Number.isFinite(c.price)){
    rateUsed=cur==="USD"?set.usd:cur==="EUR"?set.eur:cur==="CNY"?set.cny:1;
    priceBRL=parseFloat((c.price*rateUsed).toFixed(2));
    freightBRL=parseFloat(((c.freight||0)*rateUsed).toFixed(2));
    brl=parseFloat((((c.price||0)+(c.freight||0))*rateUsed).toFixed(2));
  }
  // Link final: produto validado → URL real; senão → URL de busca real do fornecedor
  const link=isProductLink?c.url:searchUrl;
  const linkType=isProductLink?"product":"search";
  const conf=final.status===SearchStatus.VERIFIED?90:final.status===SearchStatus.CHECK_DATA?65:30;
  return{
    id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    status:final.status,
    statusLabel:STATUS_LABEL[final.status]||final.status,
    statusColor:STATUS_COLOR[final.status]||"#8896AA",
    statusRank:STATUS_RANK[final.status]??99,
    reason:final.reason||"",
    query,
    supplier:String(supplier.name||"Fornecedor"),
    supId:String(supplier.id||""),
    productName:c?.name||null,
    price:c?.price??null,
    currency:cur,
    originalCurrency:cur,
    priceBRL,
    freight:c?.freight??0,
    freightNote:c?.freightNote||"não encontrado",
    freightBRL,
    brl,
    exchangePair:cur==="BRL"?"BRL":cur+"/BRL",
    exchangeRateUsed:rateUsed,
    rateSource:set.rateSource||"Investing.com",
    rateTime:set.rateTime||"",
    rateTimestamp:set.rateTimestamp||0,
    link,linkType,
    linkValidated:linkInfo.validated&&isProductLink,
    manualSearchUrl:searchUrl,
    evidence:c?.evidence||"",
    matchScore:c?.match?.score??0,
    confidence:conf,totalConfidence:conf,
    available:true,
    freeShip:c?.freightNote==="grátis confirmado",
    sellerName:"",productRating:"",productReviews:0,sellers:1,
    priceMin:c?.price||0,priceMax:c?.price||0,
    priceMinBrl:priceBRL||0,priceMaxBrl:priceBRL||0,
    needsManualFreightCheck:!c||c.freightNote==="não encontrado",
    priceSourceText:c?.evidence||"",
    warnings:final.reason?[final.reason]:[],
    note:final.reason||"",
    ts,
  };
}

// ── 10. Helper: ordenação geral dos resultados ─────────────────
function compareResults(a,b){
  if(a.statusRank!==b.statusRank) return a.statusRank-b.statusRank;
  const ab=a.brl??Infinity, bb=b.brl??Infinity;
  if(ab!==bb) return ab-bb;
  return 0;
}

// ── 1. searchMemory — cache TTL de buscas anteriores ──────────
const SEARCH_MEMORY_TTL_MS=24*60*60*1000; // 24h
const SEARCH_MEMORY_MAX_ENTRIES=80;
const searchMemory={
  _key:"piq_mem",
  _load(){try{return JSON.parse(localStorage.getItem(this._key))||{}}catch{return{}}},
  _save(m){try{localStorage.setItem(this._key,JSON.stringify(m))}catch{}},
  _norm(q){return normText(q).trim();},
  get(query,supplierId){
    const m=this._load();
    const key=this._norm(query)+"::"+supplierId;
    const entry=m[key];
    if(!entry)return null;
    if(Date.now()-entry.ts>SEARCH_MEMORY_TTL_MS)return null;
    return entry.record;
  },
  set(query,supplierId,record){
    if(!record||!record.price||record.price<=0)return;
    const m=this._load();
    const key=this._norm(query)+"::"+supplierId;
    m[key]={ts:Date.now(),record};
    // Limita tamanho
    const keys=Object.keys(m);
    if(keys.length>SEARCH_MEMORY_MAX_ENTRIES){
      keys.sort((a,b)=>m[a].ts-m[b].ts);
      for(let i=0;i<keys.length-SEARCH_MEMORY_MAX_ENTRIES;i++)delete m[keys[i]];
    }
    this._save(m);
  },
  clear(){this._save({});},
  size(){return Object.keys(this._load()).length;},
};

// ── 2. catalogSearch — procura em catálogo local do fornecedor ──
// Formato de cada linha do catálogo (texto):
//   Nome do produto | preço | moeda | link?
//   Ex: Fonte Corsair CV650 650W 80 Plus | 399.90 | BRL | https://...
function parseCatalogLine(line){
  if(!line||typeof line!=="string")return null;
  const clean=line.trim();
  if(!clean||clean.startsWith("#"))return null;
  const parts=clean.split("|").map(p=>p.trim());
  if(parts.length<2)return null;
  const name=parts[0];
  if(!name||name.length<2)return null;
  const priceRaw=(parts[1]||"").replace(/[^\d.,]/g,"");
  let price=NaN;
  if(priceRaw.includes(",")&&priceRaw.includes(".")){
    const lc=priceRaw.lastIndexOf(","),ld=priceRaw.lastIndexOf(".");
    price=lc>ld?parseFloat(priceRaw.replace(/\./g,"").replace(",",".")):parseFloat(priceRaw.replace(/,/g,""));
  } else if(priceRaw.includes(",")){
    price=parseFloat(priceRaw.replace(",","."));
  } else {
    price=parseFloat(priceRaw);
  }
  if(!Number.isFinite(price)||price<=0)return null;
  const currency=(parts[2]||"BRL").toUpperCase();
  if(!["BRL","USD","EUR","CNY"].includes(currency))return null;
  const link=(parts[3]||"").trim();
  return{name,price,currency,link:link||""};
}
function parseCatalogText(text){
  if(!text||typeof text!=="string")return[];
  return text.split(/\r?\n/).map(parseCatalogLine).filter(Boolean);
}
function catalogSearch(supplier,queryMeta){
  const items=Array.isArray(supplier.catalog)?supplier.catalog:[];
  if(!items.length)return null;
  let best=null,bestScore=0;
  for(const item of items){
    if(!item||!item.name||!item.price)continue;
    const sc=scoreProduct(queryMeta,item.name);
    if(sc.isNegative)continue;
    if(sc.score>bestScore){bestScore=sc.score;best={item,score:sc};}
  }
  if(!best||bestScore<55)return null;
  return{
    productName:best.item.name,
    price:best.item.price,
    currency:best.item.currency||supplier.cur||"BRL",
    link:best.item.link||"",
    availability:"em catálogo",
    matchScore:bestScore,
    evidence:"Linha do catálogo: "+best.item.name+" "+best.item.currency+" "+best.item.price,
  };
}

// ── 3. textInterpreter — extrai produto/preço de texto colado ──
// Estratégia 100% local (sem IA): regex de moeda + nome ao redor.
function interpretPastedText(text,queryMeta){
  if(!text||typeof text!=="string"||text.trim().length<3){
    return{ok:false,reason:"Texto muito curto"};
  }
  const t=text.replace(/\s+/g," ").trim();
  // Tenta cada moeda; pega o maior preço plausível com bom match no texto
  const currencies=["BRL","USD","EUR","CNY"];
  let best=null;
  for(const cur of currencies){
    const prices=findPrices(t,cur);
    for(const p of prices){
      if(!isPlausiblePrice(p.value,cur))continue;
      // Recorta janela ao redor do preço, procura nome
      const start=Math.max(0,p.position-300);
      const end=Math.min(t.length,p.position+300);
      const window=t.slice(start,end);
      const candidateName=findNameNear(t,p.position,queryMeta)||t.slice(0,Math.min(140,t.length)).trim();
      if(!candidateName)continue;
      const sc=scoreProduct(queryMeta,candidateName);
      if(sc.isNegative)continue;
      const conf=Math.min(95,Math.round(sc.score*0.9+(p.value>0?10:0)));
      if(!best||conf>best.confidence){
        best={
          ok:true,
          productName:candidateName,
          price:p.value,
          currency:cur,
          availability:/em estoque|dispon[ií]vel|in stock/i.test(window)?"em estoque":(/esgot|sem estoque|out of stock/i.test(window)?"esgotado":""),
          matchScore:sc.score,
          confidence:conf,
          evidence:window.slice(0,240),
        };
      }
    }
  }
  if(!best)return{ok:false,reason:"Nenhum preço encontrado no texto"};
  return best;
}

// ── 4. linkInterpreter — tenta ler URL colada via Jina+proxy ──
// Link colado: exige JSON-LD estruturado. Markdown é rejeitado para evitar
// produto-fantasma de home/vitrine. Páginas de bloqueio retornam BLOCKED.
async function interpretPastedLink(url,queryMeta,supplier){
  if(!url||!/^https?:\/\//i.test(url)){
    return{ok:false,reason:"URL inválida"};
  }
  let content=null,blocked=false;
  try{content=await fetchViaJina(url);}catch(e){
    if(e&&e.siteBlocked) blocked=true;
    else{try{content=await fetchViaCorsProxy(url);}catch{}}
  }
  if(blocked) return{ok:false,blocked:true,reason:"Site bloqueou leitura — preencha manualmente"};
  if(!content||content.length<200){
    return{ok:false,reason:"Link não pôde ser lido — preencha manualmente"};
  }
  if(looksBlocked(content)){
    return{ok:false,blocked:true,reason:"Página de bloqueio detectada (CAPTCHA/Cloudflare/login) — preencha manualmente"};
  }
  // Exige JSON-LD do próprio produto. Markdown é rejeitado aqui.
  const jsonLd=extractJsonLd(content,supplier);
  if(!jsonLd.length){
    return{ok:false,reason:"Página sem dados estruturados confiáveis (JSON-LD) — preencha manualmente"};
  }
  const scored=jsonLd.map(c=>({...c,match:scoreProduct(queryMeta,c.name)}));
  const viable=scored.filter(c=>c.match.score>=60&&!c.match.isNegative);
  if(!viable.length){
    return{ok:false,reason:"Página tem produtos estruturados, mas nenhum corresponde à busca"};
  }
  viable.sort((a,b)=>b.match.score-a.match.score);
  // Ambíguo: 2+ produtos com match próximos → rejeita (não escolhe aleatório)
  if(viable.length>1&&(viable[0].match.score-viable[1].match.score)<10){
    return{ok:false,reason:"Página tem múltiplos produtos com match similar — ambíguo, preencha manualmente"};
  }
  const c=viable[0];
  return{
    ok:true,
    productName:c.name,
    price:c.price,
    currency:c.currency,
    link:c.url||url,
    availability:"em estoque",
    matchScore:c.match.score,
    confidence:Math.min(90,Math.round(c.match.score*0.95)),
    evidence:c.evidence||"",
    source:"json-ld",
  };
}

// ── 5. agentPlanner — escolhe métodos por fornecedor ──────────
function agentPlanner(supplier,query,queryMeta){
  const allowed=Array.isArray(supplier.allowedMethods)&&supplier.allowedMethods.length
    ?supplier.allowedMethods:DEFAULT_METHODS;
  const plan=[];
  // 1. Catálogo local primeiro (offline, instantâneo)
  if(allowed.includes(SearchMethod.CATALOG)&&Array.isArray(supplier.catalog)&&supplier.catalog.length){
    plan.push({method:SearchMethod.CATALOG,reason:"Catálogo local disponível"});
  }
  // 2. Memória de busca (cache TTL)
  if(allowed.includes(SearchMethod.SAVED_RESULTS)){
    const cached=searchMemory.get(query,supplier.id);
    if(cached)plan.push({method:SearchMethod.SAVED_RESULTS,reason:"Resultado em memória",_cached:cached});
  }
  // 3. Conector público (Jina+proxy)
  if(allowed.includes(SearchMethod.PUBLIC_CONNECTOR)&&supplier.supportsPublicSearch!==false&&!supplier.requiresLogin){
    plan.push({method:SearchMethod.PUBLIC_CONNECTOR,reason:"Site permite leitura pública"});
  }
  // 4. Sempre disponível como fallback final: assistência humana
  plan.push({method:SearchMethod.ASSISTED,reason:"Captura assistida (fallback)"});
  return{supplierId:supplier.id,supplierName:supplier.name,plan,allowed};
}

// ── 7. searchWithAgent — orquestrador principal ───────────────
async function searchWithAgent(query,supplier,queryMeta,set){
  const ts=new Date().toISOString();
  const plan=agentPlanner(supplier,query,queryMeta);
  let lastReason="Nenhum método retornou resultado válido";
  for(const step of plan.plan){
    try{
      if(step.method===SearchMethod.CATALOG){
        const hit=catalogSearch(supplier,queryMeta);
        if(hit)return buildCatalogResultRecord(query,supplier,set,hit,ts);
        lastReason="Nenhum produto compatível no catálogo local";
      } else if(step.method===SearchMethod.SAVED_RESULTS){
        if(step._cached)return buildMemoryResultRecord(step._cached,ts);
      } else if(step.method===SearchMethod.PUBLIC_CONNECTOR){
        const r=await searchSupplier(query,supplier,queryMeta,set);
        if(r){
          if(r.status===SearchStatus.VERIFIED||r.status===SearchStatus.CHECK_DATA){
            searchMemory.set(query,supplier.id,r);
            return r;
          }
          if(r.status===SearchStatus.BLOCKED){
            return buildAssistedNeededRecord(query,supplier,set,"Site bloqueou leitura automática — use captura assistida.",ts);
          }
          lastReason=r.reason||"Conector público sem resultado válido";
        }
      } else if(step.method===SearchMethod.ASSISTED){
        return buildAssistedNeededRecord(query,supplier,set,lastReason,ts);
      }
    } catch(e){
      lastReason=e.message||String(e);
    }
  }
  return buildAssistedNeededRecord(query,supplier,set,lastReason,ts);
}

// ── 9. SelfTest do agente — runAgentSelfTest() ─────────────────
function runAgentSelfTest(){
  const out=[];let pass=0,fail=0;
  const t=(name,ok,detail)=>{out.push((ok?"✅":"❌")+" "+name+(detail?" — "+detail:""));ok?pass++:fail++;};
  // parseCatalogLine
  const c1=parseCatalogLine("Fonte Corsair CV650 650W 80 Plus Bronze | 399.90 | BRL");
  t("parseCatalogLine BRL",c1&&c1.price===399.90&&c1.currency==="BRL");
  const c2=parseCatalogLine("PSU Corsair 650W | 89.99 | USD | https://x.com/p/1");
  t("parseCatalogLine USD+link",c2&&c2.currency==="USD"&&c2.link==="https://x.com/p/1");
  t("parseCatalogLine vazio",parseCatalogLine("")===null);
  t("parseCatalogLine comentário",parseCatalogLine("# nota")===null);
  // parseCatalogText
  const t1=parseCatalogText("Item Alpha | 1 | BRL\n# nota\nItem Beta | 2 | USD");
  t("parseCatalogText 2 itens",t1.length===2,"got "+t1.length);
  // catalogSearch
  const qm=analyzeQuery("fonte corsair 650w");
  const supC={id:"sx",name:"X",cur:"BRL",catalog:[{name:"Fonte Corsair CV650 650W 80 Plus",price:399.90,currency:"BRL"},{name:"Cabo USB",price:10,currency:"BRL"}]};
  const hit=catalogSearch(supC,qm);
  t("catalogSearch encontra produto certo",hit&&/corsair/i.test(hit.productName));
  // interpretPastedText
  const it=interpretPastedText("Fonte Corsair CV650 650W 80 Plus Bronze R$ 399,90 Em estoque",qm);
  t("interpretPastedText preço BR",it.ok&&it.price===399.9&&it.currency==="BRL");
  const it2=interpretPastedText("PSU Corsair 650W $ 89.99 in stock",analyzeQuery("psu corsair 650w"));
  t("interpretPastedText preço USD",it2.ok&&it2.price===89.99&&it2.currency==="USD");
  const it3=interpretPastedText("apenas texto sem preço",qm);
  t("interpretPastedText sem preço falha",!it3.ok);
  // agentPlanner
  const supA={id:"sa",name:"A",cur:"BRL",supportsPublicSearch:true,requiresLogin:false,allowedMethods:DEFAULT_METHODS,catalog:[{name:"Fonte Corsair",price:300,currency:"BRL"}]};
  const planA=agentPlanner(supA,"fonte corsair 650w",qm);
  t("planner inclui catálogo",planA.plan.some(p=>p.method===SearchMethod.CATALOG));
  t("planner inclui conector",planA.plan.some(p=>p.method===SearchMethod.PUBLIC_CONNECTOR));
  t("planner termina em assistido",planA.plan[planA.plan.length-1].method===SearchMethod.ASSISTED);
  const supB={id:"sb",name:"B",cur:"BRL",supportsPublicSearch:false,requiresLogin:false,allowedMethods:DEFAULT_METHODS,catalog:[]};
  const planB=agentPlanner(supB,"x",qm);
  t("planner sem conector quando supportsPublicSearch=false",!planB.plan.some(p=>p.method===SearchMethod.PUBLIC_CONNECTOR));
  // searchMemory
  searchMemory.clear();
  const fake={status:SearchStatus.VERIFIED,price:100,currency:"BRL",supplier:"X"};
  searchMemory.set("teste","sx",fake);
  t("searchMemory salva e lê",searchMemory.get("teste","sx")?.price===100);
  t("searchMemory miss em query nova",searchMemory.get("outra","sx")===null);
  console.log("%c[AgentSelfTest]","color:#9D5CFF;font-weight:bold","resultado:");
  out.forEach(l=>console.log(l));
  console.log(`%c${pass} passou, ${fail} falhou`,`color:${fail?"#FF4D6D":"#00E5A0"};font-weight:bold`);
  return{pass,fail,out};
}

// ANÁLISE FINAL DE RESULTADOS
// ══════════════════════════════════════════════════════
async function aiAnalyze(product,results){
  const set=ST.settings;
  const valid=results.filter(r=>r&&r.brl>0&&(r.status===SearchStatus.VERIFIED||r.status===SearchStatus.CHECK_DATA||r.status===SearchStatus.CATALOG_HIT||r.status===SearchStatus.MEMORY_HIT||r.status===SearchStatus.MANUAL_SEARCH)).sort((a,b)=>a.brl-b.brl);
  const bestPrice=valid[0];
  const bestRecommended=[...valid].sort((a,b)=>{
    const ac=(a.totalConfidence||75)+(a.sellerName?8:0)+(a.productRating?6:0)-(a.needsManualFreightCheck?5:0);
    const bc=(b.totalConfidence||75)+(b.sellerName?8:0)+(b.productRating?6:0)-(b.needsManualFreightCheck?5:0);
    const ap=((a.brl-(bestPrice?.brl||a.brl))/(bestPrice?.brl||a.brl))*30;
    const bp=((b.brl-(bestPrice?.brl||b.brl))/(bestPrice?.brl||b.brl))*30;
    return (bc-bp)-(ac-ap);
  })[0]||bestPrice;
  const worst=valid[valid.length-1];
  const alerts=[];
  if(valid.some(r=>r.needsManualFreightCheck||r.freightNote==="não encontrado")) alerts.push("Frete não encontrado em alguns resultados — confirme no site antes de comprar.");
  if(valid.some(r=>(r.totalConfidence||100)<75)) alerts.push("Alguns resultados têm confiança média — confira o link do produto.");
  if(valid.some(r=>r.currency&&r.currency!=="BRL")) alerts.push(`Cotação usada: USD ${fmt4(set.usd)}, CNY ${fmt4(set.cny)}, EUR ${fmt4(set.eur)} (${set.rateSource||"Investing.com"} ${set.rateTime||""}).`);
  return{
    bestChoice:bestRecommended?.supplier||bestPrice?.supplier||"—",
    bestPriceOnly:bestPrice?.supplier||"—",
    reason:bestRecommended&&bestPrice&&bestRecommended.supplier!==bestPrice.supplier
      ?`${bestRecommended.supplier} parece mais seguro pelos dados disponíveis, mesmo não sendo necessariamente o menor preço.`
      :"Menor custo total convertido para BRL.",
    summary:`${valid.length} fornecedor${valid.length!==1?"es":""} com resultado. Melhor preço: ${bestPrice?("R$ "+fmt(bestPrice.brl)+" em "+bestPrice.supplier):"—"}.`,
    alerts,
    resellerTip:bestPrice?`Sugestão de revenda com ${set.margin}%: R$ ${fmt(bestPrice.brl*(1+set.margin/100))}`:"",
    savings:worst&&bestPrice&&worst.brl>bestPrice.brl?`Economia de até R$ ${fmt(worst.brl-bestPrice.brl)} contra o maior preço.`:"",
    incompleteData:valid.filter(r=>!r.sellerName||!r.productRating||r.needsManualFreightCheck).map(r=>r.supplier)
  };
}

// SEARCH FLOW — por fornecedor, com progresso ao vivo
// ══════════════════════════════════════════════════════
async function doSearch(){
  const inp=document.getElementById("q-inp");
  const q=inp?inp.value.trim():ST.query.trim();
  if(!q){toast("Digite um produto","err");return}
  const active=ST.suppliers.filter(s=>s.on);
  const targets=ST.selIds.length?ST.suppliers.filter(s=>ST.selIds.includes(s.id)&&s.on):active;
  if(!targets.length){toast("Nenhum fornecedor ativo","err");return}

  ST.query=q;
  ST.searching=true;ST.results=[];ST.insight=null;ST.meta=null;ST.expandId=null;ST.searchErrors=[];
  ST.progDone=0;ST.progTotal=targets.length;ST.progCur=targets[0]?.name||"";
  nav("results");

  const queryMeta=analyzeQuery(q);
  const hasIntl=targets.some(s=>s.cur!=="BRL");
  if(hasIntl)await fetchLiveRates();

  // ── AI Search Agent: para cada fornecedor, escolhe método e executa ──
  const tasks=targets.map(sup=>{
    return Promise.race([
      searchWithAgent(q,sup,queryMeta,ST.settings),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error("Timeout no fornecedor "+sup.name)),40000))
    ]).then(r=>{
      ST.progDone++;ST.progCur=sup.name;
      if(r&&r.status){
        ST.results.push(r);
        ST.results.sort(compareResults);
        renderResultCards();
      }
      updateProg();
      return r;
    }).catch(e=>{
      ST.progDone++;
      console.error("[PriceIQ]",sup.name,e);
      const ts=new Date().toISOString();
      const errResult=buildAssistedNeededRecord(q,sup,ST.settings,e.message||String(e),ts);
      errResult.status=SearchStatus.ERROR;
      errResult.statusLabel=STATUS_LABEL.error;
      errResult.statusColor=STATUS_COLOR.error;
      errResult.statusRank=STATUS_RANK.error;
      ST.results.push(errResult);
      ST.results.sort(compareResults);
      renderResultCards();
      updateProg();
      return errResult;
    });
  });
  await Promise.allSettled(tasks);

  ST.searching=false;
  // Resultados que entram na comparação: verified, check_data, catalog_hit, memory_hit, manual_search
  const VALID=[SearchStatus.VERIFIED,SearchStatus.CHECK_DATA,SearchStatus.CATALOG_HIT,SearchStatus.MEMORY_HIT,SearchStatus.MANUAL_SEARCH];
  const valid=ST.results.filter(r=>VALID.includes(r.status)&&r.brl>0);
  const bestBRL=valid.length?valid[0].brl:0;
  const bestSup=valid.length?valid[0].supplier:"";
  const m={id:"s"+Date.now(),query:q,ts:new Date().toISOString(),
    count:valid.length,total:ST.results.length,bestBRL,bestSup};
  ST.meta=m;
  ST.history=[m,...ST.history.slice(0,49)];
  persist();renderResults();

  if(!valid.length){
    const assistedNeeded=ST.results.filter(r=>r.status===SearchStatus.NEEDS_ASSISTED_CAPTURE).length;
    const blocked=ST.results.filter(r=>r.status===SearchStatus.BLOCKED).length;
    if(assistedNeeded>0) toast("Captura assistida necessária — use os botões em cada card","err");
    else if(blocked>0) toast("Sites bloquearam leitura — cole texto/link ou preencha manualmente","err");
    else toast("Nenhum resultado válido — confira manualmente nos sites","err");
  }

  if(valid.length){
    ST.aiLoading=true;renderAiBox();
    try{ST.insight=await aiAnalyze(q,valid)}catch{ST.insight=null}
    ST.aiLoading=false;renderAiBox();
  }
}

function updateProg(){
  const fill=document.getElementById("prog-fill");
  const txt=document.getElementById("prog-txt");
  const cnt=document.getElementById("prog-cnt");
  const pct=ST.progTotal?Math.round(ST.progDone/ST.progTotal*100):0;
  if(fill)fill.style.width=pct+"%";
  if(txt)txt.textContent=ST.progCur?"Buscando "+ST.progCur+"…":"Processando…";
  if(cnt)cnt.textContent=ST.progDone+"/"+ST.progTotal;
}

            ${ST.selIds.length?`<button style="background:none;border:none;color:#4A5568;font-size:12px;font-weight:600;cursor:pointer" onclick="clearSel()">Limpar</button>`:""}
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${chips}</div>
        ${ST.selIds.length?`<p style="color:#4A5568;font-size:11px;margin-top:8px">${ico.info} Buscará apenas nos fornecedores selecionados acima. Sem seleção = busca em todos.</p>`:""}
      </div>
      <button class="btn btn-p" onclick="doSearch()">${ico.search} Buscar Preços Reais</button>
    </div>

    ${ST.history.length?`
    <div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="2" stroke-linecap="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 0 .5-4M3 3v5h5"/></svg>
        <span style="color:#4A5568;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px">Buscas recentes</span>
      </div>
      ${recent}
    </div>`:""}
  `;
}

async function refreshRates(){
  toast("Atualizando cotações…");
  const r=await fetchLiveRates(true);
  renderHome();
  if(!r.fromCache&&!r.partial)
    toast(`Cotação atualizada: USD ${fmt4(ST.settings.usd)} · EUR ${fmt4(ST.settings.eur)} · CNY ${fmt4(ST.settings.cny)}`);
  else if(!r.fromCache&&r.partial)
    toast(`Atualização parcial: USD ${fmt4(ST.settings.usd)} (algumas moedas mantiveram valor anterior)`);
  else if(ST.settings.usd>0)
    toast(`Mantendo última cotação: USD ${fmt4(ST.settings.usd)} (próxima tentativa em 1min)`);
  else toast("Sem cotação disponível — tente novamente em 1 minuto","err");
}

function recallQuery(idx){
  const h=ST.history[idx];
  if(!h)return;
  ST.query=h.query;renderHome();
}
function toggleChip(btn){
  const sid=btn.getAttribute("data-sid");if(!sid)return;
  const idx=ST.selIds.indexOf(sid);
  if(idx>=0)ST.selIds.splice(idx,1);else ST.selIds.push(sid);
  renderHome();
}
function clearSel(){ST.selIds=[];renderHome()}
function selAll(){ST.selIds=ST.suppliers.filter(s=>s.on).map(s=>s.id);renderHome()}

    :`${ST.results.length} resultado${ST.results.length!==1?"s":""}`;

  const progHTML=ST.searching?`
    <div class="card" style="margin-bottom:18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:8px">

          <span id="prog-txt" style="color:#E8F0FE;font-size:14px;font-weight:500">Buscando…</span>
        </div>
        <span id="prog-cnt" style="color:#00D4FF;font-weight:800">0/${ST.progTotal}</span>
      </div>
      <div class="prog-wrap"><div id="prog-fill" class="prog-fill" style="width:0%"></div></div>
    </div>`:"";

    <div style="text-align:center;padding:60px 20px;background:#111827;border-radius:18px;border:1px solid #1C2A3A">
      <p style="color:#8896AA;font-size:16px;font-weight:700;margin-bottom:6px">Nenhum resultado</p>
      <p style="color:#4A5568;font-size:14px;margin-bottom:20px">Tente outros termos ou fornecedores diferentes.</p>
      <button class="btn btn-g btn-sm" onclick="nav('home')" style="margin:0 auto">Nova busca</button>
    </div>`:"";
  const partialErrorHTML="";

  document.getElementById("page-results").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:10px">
      <div style="flex:1;min-width:0">
        <h2 style="color:#E8F0FE;font-size:19px;font-weight:800;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${q}</h2>
        <p style="color:#4A5568;font-size:13px">${sub}</p>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        ${!ST.searching&&ST.results.length?`
          <button class="btn btn-g btn-sm" onclick="saveSearch()">${ico.save}</button>
          <button class="btn btn-p btn-sm" onclick="openExportSheet()">${ico.share} Exportar</button>
        `:""}

function renderResultCards(){
  const ca=document.getElementById("cards-area");
