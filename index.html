}

// ══════════════════════════════════════════════════════
// TAREFA 13 — CARDS DETALHADOS
// ══════════════════════════════════════════════════════
function buildCards(){
  const results=ST.results;
  const ins=ST.insight;
  const PRICED_STATUS=[SearchStatus.VERIFIED,SearchStatus.CHECK_DATA,SearchStatus.CATALOG_HIT,SearchStatus.MEMORY_HIT,SearchStatus.MANUAL_SEARCH];
  const ASSIST_STATUS=[SearchStatus.NEEDS_ASSISTED_CAPTURE,SearchStatus.BLOCKED,SearchStatus.ERROR];
  const verifiedResults=results.filter(r=>r.brl>0&&PRICED_STATUS.includes(r.status));
  const bestBRL=verifiedResults[0]?.brl||0;
  return results.map((r,i)=>{
    const hasPrice=Number.isFinite(r.brl)&&r.brl>0&&PRICED_STATUS.includes(r.status);
    const isBestPrice=hasPrice&&verifiedResults.indexOf(r)===0;
    const isBestRec=ins&&ins.bestChoice===r.supplier;
    const isHighConf=r.status===SearchStatus.VERIFIED;
    const diff=hasPrice&&bestBRL&&!isBestPrice?((r.brl-bestBRL)/bestBRL*100).toFixed(1):null;
    const isExp=ST.expandId===r.id;
    const needsAssist=ASSIST_STATUS.includes(r.status);
    const showManualForm=needsAssist&&ST.manualFormId===r.id;
    const resell=hasPrice?fmt((r.brl||0)*(1+ST.settings.margin/100)):null;

    // Status badge (always present)
    const statusBadge=`<span class="tag" style="background:${r.statusColor}22;color:${r.statusColor};border:1px solid ${r.statusColor}55;font-weight:800">${esc(r.statusLabel||"—")}</span>`;

    // Outros badges (só para resultados com preço)
    const badges=[
      statusBadge,
      hasPrice&&isBestPrice?`<span class="tag" style="background:rgba(0,212,255,.12);color:#00D4FF;border:1px solid rgba(0,212,255,.3)">💰 Menor preço</span>`:"",
      hasPrice&&isBestRec&&!isBestPrice?`<span class="tag" style="background:rgba(255,184,0,.12);color:#FFB800;border:1px solid rgba(255,184,0,.3)">${ico.trophy} Melhor opção</span>`:"",
      hasPrice&&isHighConf?`<span class="tag" style="background:rgba(0,229,160,.1);color:#00E5A0;border:1px solid rgba(0,229,160,.3)">${ico.shield} Match ${r.matchScore}%</span>`:"",
      diff?`<span class="tag" style="background:rgba(74,85,104,.15);color:#8896AA;border:1px solid rgba(74,85,104,.3)">+${diff}% vs melhor</span>`:"",
    ].filter(Boolean).join("");

    // Frete display (só faz sentido com preço)
    let freightDisplay="";
    if(hasPrice){
      if(r.freeShip){
        freightDisplay=`<span style="color:#00E5A0;font-weight:700">Frete grátis ✅</span>`;
      } else if(r.freightNote==="não encontrado"||r.needsManualFreightCheck){
        freightDisplay=`<span style="color:#FFB800">Não encontrado — confira no site</span>`;
      } else if(r.freight>0){
        freightDisplay=`<span>${esc(r.currency)} ${fmt(r.freight)} (R$ ${fmt(r.freightBRL)})</span>`;
      } else {
        freightDisplay=`<span style="color:#4A5568">Não encontrado</span>`;
      }
    }

    // Cotação display (apenas com preço internacional)
    const rateDisplay=hasPrice&&r.currency!=="BRL"
      ?`<div style="background:#070B14;border-radius:8px;padding:7px 10px;font-size:11px;color:#4A5568;margin-bottom:8px">
          ${ico.info} <span style="color:#8896AA">${esc(r.currency)}/BRL: <strong style="color:#00D4FF">${typeof r.exchangeRateUsed==="number"?fmt4(r.exchangeRateUsed):"—"}</strong></span>
          <span style="margin-left:8px">Fonte: ${esc(r.rateSource||"Investing.com")}</span>
          ${r.rateTime?`<span style="margin-left:6px">· ${esc(r.rateTime)}</span>`:""}
        </div>`:"";

    // Expanded details
    const expandedHTML=isExp?`
      <div class="res-extra open">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
          ${r.productName?`<div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Produto encontrado</p><p style="color:#E8F0FE;font-size:13px">${esc(r.productName)}</p></div>`:""}
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Fornecedor</p><p style="color:#E8F0FE;font-size:13px">${esc(r.supplier)}</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Status</p><p style="color:${r.statusColor};font-size:13px;font-weight:700">${esc(r.statusLabel)}</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Match</p><p style="color:#E8F0FE;font-size:13px;font-weight:700">${r.matchScore||0}%</p></div>
          ${hasPrice?`<div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Preço original</p><p style="color:#E8F0FE;font-size:13px;font-weight:700">${esc(r.currency)} ${fmt(r.price)}</p></div>`:""}
          ${hasPrice?`<div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Preço em BRL</p><p style="color:#00D4FF;font-size:13px;font-weight:700">R$ ${fmt(r.priceBRL||r.brl)}</p></div>`:""}
          ${hasPrice&&r.currency!=="BRL"?`<div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Cotação usada</p><p style="color:#E8F0FE;font-size:13px">${esc(r.exchangePair)} = ${typeof r.exchangeRateUsed==="number"?fmt4(r.exchangeRateUsed):"—"} · ${esc(r.rateSource||"Investing.com")} ${esc(r.rateTime||"")}</p></div>`:""}
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Link</p><p style="color:#E8F0FE;font-size:13px">${r.linkType==="product"?"Direto ao produto ✅":"Página de busca do fornecedor"}</p></div>
          <div><p style="color:#4A5568;font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Horário busca</p><p style="color:#E8F0FE;font-size:13px">${fmtDate(r.ts)}</p></div>
        </div>
        ${r.evidence?`<p style="color:#4A5568;font-size:11px;margin-bottom:8px;padding:7px 10px;background:#0D1320;border-radius:8px">💬 Evidência: "${esc(r.evidence).slice(0,200)}"</p>`:""}
        ${r.reason?`<p style="color:#8896AA;font-size:12px;padding:9px 12px;background:#0D1320;border-radius:8px;margin-top:4px">${ico.info} ${esc(r.reason)}</p>`:""}
      </div>`:"";

    const cardClass=`res-card${isBestPrice?" best":""}${isBestRec&&!isBestPrice?" recommended":""}`;

    const priceHeader=hasPrice
      ?`<div style="text-align:right;flex-shrink:0">
          <p style="color:${isBestPrice?"#00D4FF":"#E8F0FE"};font-size:22px;font-weight:800;margin:0">R$ ${fmt(r.brl)}</p>
          ${r.currency!=="BRL"?`<p style="color:#4A5568;font-size:11px">${esc(r.currency)} ${fmt(r.price)}</p>`:""}
        </div>`
      :`<div style="text-align:right;flex-shrink:0;max-width:140px">
          <p style="color:${r.statusColor};font-size:13px;font-weight:800;margin:0;line-height:1.2">${esc(r.statusLabel)}</p>
        </div>`;

    const productNameLine=r.productName
      ?`<p style="color:#E8F0FE;font-size:15px;font-weight:700;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.productName)}</p>`
      :`<p style="color:#8896AA;font-size:13px;font-style:italic;margin-bottom:3px">Sem produto verificado</p>`;

    const detailsGrid=hasPrice?`
        <div class="pgrid">
          <div class="pcell">
            <p class="plabel">Frete</p>
            <p class="pval" style="font-size:12px">${freightDisplay}</p>
          </div>
          <div class="pcell">
            <p class="plabel">Match</p>
            <p class="pval" style="font-size:12px;color:${r.matchScore>=85?"#00E5A0":r.matchScore>=60?"#FFB800":"#FF4D6D"};font-weight:700">${r.matchScore||0}%</p>
          </div>
          <div class="pcell">
            <p class="plabel">Revenda ${ST.settings.margin}%</p>
            <p class="pval" style="color:#00E5A0">R$ ${resell}</p>
          </div>
        </div>`:`
        <p style="color:#4A5568;font-size:12px;margin-bottom:10px;padding:9px 12px;background:#0D1320;border-radius:8px">${ico.info} ${esc(r.reason||"Confira a busca no site para verificar manualmente.")}</p>`;

    const linkBtnLabel=r.linkType==="product"?"Ver Produto":"Buscar no site";
    const linkBtnIcon=r.linkType==="product"?ico.link:ico.search;
    const linkBtnTitle=r.linkType==="product"
      ?"Link direto ao produto (verificado)"
      :"Link real de busca do fornecedor — confira o produto manualmente";
    const linkWarn=r.linkType!=="product"
      ?`<p style="color:#8896AA;font-size:10px;margin-top:4px">${ico.alert} Link de busca real — não há link direto ao produto. Confira o resultado no site do fornecedor.</p>`
      :"";

    return`<div class="${cardClass}">
      <div class="res-body">
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">${badges}</div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px">
          <div style="flex:1;min-width:0">
            ${productNameLine}
            <p style="color:#00D4FF;font-size:13px;font-weight:600">${esc(r.supplier)}</p>
          </div>
          ${priceHeader}
        </div>
        ${rateDisplay}
        ${detailsGrid}
        <div class="arow">
          <a href="${esc(r.link||r.manualSearchUrl||"#")}" target="_blank" rel="noopener noreferrer" class="arow-btn${r.linkType==="product"?" primary":""}" title="${linkBtnTitle}">
            ${linkBtnIcon}
            ${linkBtnLabel}
          </a>
          ${needsAssist?`<button class="arow-btn" data-rid="${esc(r.id)}" data-tab="text" onclick="setAssistedTab(this)" title="Colar texto do produto" style="color:#00D4FF;border-color:#00D4FF44">${ico.edit} Colar texto</button>`:""}
          ${needsAssist?`<button class="arow-btn" data-rid="${esc(r.id)}" data-tab="link" onclick="setAssistedTab(this)" title="Colar link do produto" style="color:#00D4FF;border-color:#00D4FF44">${ico.link} Colar link</button>`:""}
          ${needsAssist?`<button class="arow-btn" data-rid="${esc(r.id)}" data-tab="manual" onclick="setAssistedTab(this)" title="Preencher manualmente" style="color:#00D4FF;border-color:#00D4FF44">${ico.edit} Manual</button>`:""}
          <button class="arow-btn icon-only" data-rid="${esc(r.id)}" onclick="toggleExpand(this)" title="Detalhes">${ico.eye}</button>
          <button class="arow-btn icon-only danger" data-rid="${esc(r.id)}" onclick="delResult(this)" title="Remover">${ico.trash}</button>
        </div>
        ${linkWarn}
        ${showManualForm?(()=>{
          const tab=ST.assistedTab||"text";
          const tabBtn=(t,label)=>`<button class="arow-btn${tab===t?" primary":""}" data-rid="${esc(r.id)}" data-tab="${t}" onclick="setAssistedTab(this)" style="flex:1;font-size:11px">${label}</button>`;
          const textForm=`<div style="margin-top:10px">
            <label style="color:#4A5568;font-size:10px;font-weight:700;display:block;margin-bottom:4px">COLE AQUI O TEXTO COPIADO DA PÁGINA DO PRODUTO</label>
            <textarea name="ptext" rows="4" placeholder="Cole o trecho que tem o nome e o preço — ex: 'Fonte Corsair CV650 650W 80 Plus Bronze R$ 399,90 Em estoque'" style="width:100%;box-sizing:border-box;background:#070B14;border:1px solid #1C2A3A;border-radius:7px;color:#E8F0FE;font-size:13px;padding:8px 10px;outline:none;resize:vertical;font-family:inherit"></textarea>
            <div style="display:flex;gap:8px;margin-top:8px">
              <button class="arow-btn primary" data-rid="${esc(r.id)}" onclick="submitPastedText(this)" style="flex:1">${ico.check} Interpretar texto</button>
              <button class="arow-btn" data-rid="${esc(r.id)}" onclick="toggleManualForm(this)">Cancelar</button>
            </div>
            <p style="color:#4A5568;font-size:10px;margin-top:6px">${ico.info} O agente extrai o preço sem inventar. Se não houver preço claro, será rejeitado.</p>
          </div>`;
          const linkForm=`<div style="margin-top:10px">
            <label style="color:#4A5568;font-size:10px;font-weight:700;display:block;margin-bottom:4px">COLE A URL DO PRODUTO (PÁGINA INDIVIDUAL, NÃO DE BUSCA)</label>
            <input name="plink" type="url" placeholder="https://${esc(r.supplier?.toLowerCase()?.replace(/\\s/g,"")||"fornecedor")}.com.br/produto/..." style="width:100%;box-sizing:border-box;background:#070B14;border:1px solid #1C2A3A;border-radius:7px;color:#E8F0FE;font-size:13px;padding:8px 10px;outline:none">
            <div style="display:flex;gap:8px;margin-top:8px">
              <button class="arow-btn primary" data-rid="${esc(r.id)}" onclick="submitPastedLink(this)" style="flex:1">${ico.link} Ler link</button>
              <button class="arow-btn" data-rid="${esc(r.id)}" onclick="toggleManualForm(this)">Cancelar</button>
            </div>
            <p style="color:#4A5568;font-size:10px;margin-top:6px">${ico.info} Tenta ler via Jina Reader. Se o site bloquear, troque para "Manual".</p>
          </div>`;
          const manualForm=`<div style="margin-top:10px">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
              <div style="grid-column:1/-1">
                <label style="color:#4A5568;font-size:10px;font-weight:700;display:block;margin-bottom:3px">NOME DO PRODUTO *</label>
                <input name="mname" type="text" placeholder="ex: iPhone 14 128GB" style="width:100%;box-sizing:border-box;background:#070B14;border:1px solid #1C2A3A;border-radius:7px;color:#E8F0FE;font-size:13px;padding:8px 10px;outline:none">
              </div>
              <div><label style="color:#4A5568;font-size:10px;font-weight:700;display:block;margin-bottom:3px">PREÇO *</label>
                <input name="mprice" type="text" inputmode="decimal" placeholder="ex: 3999.90" style="width:100%;box-sizing:border-box;background:#070B14;border:1px solid #1C2A3A;border-radius:7px;color:#E8F0FE;font-size:13px;padding:8px 10px;outline:none">
              </div>
              <div><label style="color:#4A5568;font-size:10px;font-weight:700;display:block;margin-bottom:3px">MOEDA</label>
                <select name="mcur" style="width:100%;box-sizing:border-box;background:#070B14;border:1px solid #1C2A3A;border-radius:7px;color:#E8F0FE;font-size:13px;padding:8px 10px;outline:none">
                  <option value="BRL">BRL (R$)</option><option value="USD">USD ($)</option><option value="EUR">EUR (€)</option><option value="CNY">CNY (¥)</option>
                </select>
              </div>
              <div><label style="color:#4A5568;font-size:10px;font-weight:700;display:block;margin-bottom:3px">FRETE (0 = grátis)</label>
                <input name="mfreight" type="text" inputmode="decimal" placeholder="ex: 29.90 ou 0" style="width:100%;box-sizing:border-box;background:#070B14;border:1px solid #1C2A3A;border-radius:7px;color:#E8F0FE;font-size:13px;padding:8px 10px;outline:none">
              </div>
              <div style="grid-column:1/-1">
                <label style="color:#4A5568;font-size:10px;font-weight:700;display:block;margin-bottom:3px">LINK DO PRODUTO</label>
                <input name="mlink" type="url" placeholder="https://..." style="width:100%;box-sizing:border-box;background:#070B14;border:1px solid #1C2A3A;border-radius:7px;color:#E8F0FE;font-size:13px;padding:8px 10px;outline:none">
              </div>
              <div style="grid-column:1/-1">
                <label style="color:#4A5568;font-size:10px;font-weight:700;display:block;margin-bottom:3px">OBSERVAÇÃO</label>
                <input name="mnote" type="text" placeholder="ex: promoção Black Friday" style="width:100%;box-sizing:border-box;background:#070B14;border:1px solid #1C2A3A;border-radius:7px;color:#E8F0FE;font-size:13px;padding:8px 10px;outline:none">
              </div>
            </div>
            <div style="display:flex;gap:8px">
              <button class="arow-btn primary" data-rid="${esc(r.id)}" onclick="submitManualEntry(this)" style="flex:1">${ico.check} Confirmar</button>
              <button class="arow-btn" data-rid="${esc(r.id)}" onclick="toggleManualForm(this)">Cancelar</button>
            </div>
            <p style="color:#4A5568;font-size:10px;margin-top:8px">${ico.info} Resultado marcado como "BUSCA MANUAL" — não verificado automaticamente.</p>

          return`<div class="assisted-form" style="margin-top:10px;padding:14px;background:#0D1320;border-radius:10px;border:1px solid #1C2A3A">

function submitManualEntry(btn){
  const rid=btn.getAttribute("data-rid");
  const orig=ST.results.find(r=>r.id===rid);
  if(!orig)return;
  const form=btn.closest(".assisted-form");
  const name=(form.querySelector("[name=mname]").value||"").trim();
  const priceRaw=(form.querySelector("[name=mprice]").value||"").trim().replace(",",".");
  const cur=(form.querySelector("[name=mcur]").value||"BRL");
  const link=(form.querySelector("[name=mlink]").value||"").trim();
  const freightRaw=(form.querySelector("[name=mfreight]").value||"").trim().replace(",",".");
  const note=(form.querySelector("[name=mnote]").value||"").trim();
  if(!name){toast("Nome do produto é obrigatório","err");return;}
  const price=parseFloat(priceRaw);
  if(!price||price<=0){toast("Preço inválido — use ponto como separador decimal","err");return;}
  const s=ST.settings;
  let rateUsed=1;
  if(cur==="USD")rateUsed=s.usd||5.10;
  else if(cur==="EUR")rateUsed=s.eur||5.55;
  else if(cur==="CNY")rateUsed=s.cny||0.70;
  const freight=parseFloat(freightRaw)||0;
  const priceBRL=parseFloat((price*rateUsed).toFixed(2));
  const freightBRL=parseFloat((freight*rateUsed).toFixed(2));
  const freeShip=freightRaw.toLowerCase().includes("grat")||freightRaw==="0"||freightRaw==="0.00";
  const brl=priceBRL+(freeShip?0:freightBRL);
  const ts=new Date().toISOString();
  const manualResult={
    id:"m"+Date.now(),
    status:SearchStatus.MANUAL_SEARCH,
    statusLabel:STATUS_LABEL.manual_search,
    statusColor:STATUS_COLOR.manual_search,
    statusRank:STATUS_RANK.manual_search,
    reason:"Inserido manualmente"+(note?" — "+note:""),
    query:orig.query,
    supplier:orig.supplier,supId:orig.supId,
    productName:name,
    price,currency:cur,originalCurrency:cur,
    priceBRL,freight,freightNote:freeShip?"grátis confirmado":freight>0?String(freight):"não encontrado",
    freightBRL,brl,
    exchangePair:cur==="BRL"?"BRL":cur+"/BRL",
    exchangeRateUsed:rateUsed,
    rateSource:s.rateSource||"Investing.com",rateTime:s.rateTime||"",rateTimestamp:s.rateTimestamp||0,
    link:link||orig.manualSearchUrl||"",
    linkType:link?"manual":"search",
    linkValidated:false,
    manualSearchUrl:orig.manualSearchUrl||"",
    evidence:"Inserido manualmente pelo usuário",
    matchScore:0,confidence:0,totalConfidence:0,
    available:true,freeShip,
    sellerName:"",productRating:"",productReviews:0,sellers:1,
    priceMin:price,priceMax:price,priceMinBrl:priceBRL,priceMaxBrl:priceBRL,
    needsManualFreightCheck:false,
    priceSourceText:"Manual",
    warnings:note?[note]:[],
    note:note||"Inserido manualmente",
    ts,isManual:true,
  };
  ST.results=ST.results.filter(r=>r.id!==rid);
  ST.results.push(manualResult);
  ST.results.sort(compareResults);
  ST.manualFormId=null;
  renderResultCards();
  toast("Resultado manual adicionado");
}
function saveSearch(){
  if(!ST.meta||!ST.results.length){toast("Nada para salvar","err");return}
  // Salva todos os resultados, mas marca explicitamente quais foram verificados
  const verified=ST.results.filter(r=>r.status===SearchStatus.VERIFIED||r.status===SearchStatus.CHECK_DATA);
  const rec={...ST.meta,results:ST.results,insight:ST.insight,verifiedCount:verified.length};
  ST.saved=[rec,...ST.saved.filter(x=>x.id!==rec.id)];
  persist();toast("Pesquisa salva!");
}

async function doExport(type){
  if(type==="csv"){
    const h=["Produto","Fornecedor","Vendedor","Avaliação","Reviews","Preço orig","Moeda","Câmbio","Preço BRL","Frete","Frete BRL","Frete nota","Total BRL","Disponível","Confiança","Link","Data"];
    const rows=ST.results.map(r=>[
      r.productName,r.supplier,r.sellerName||"",
      r.productRating||"",r.productReviews||0,
      r.price,r.currency,r.exchangeRateUsed||1,
      fmt(r.priceBRL||r.brl),
      r.freight,fmt(r.freightBRL||0),r.freightNote,
      fmt(r.brl),r.available?"Sim":"Não",
      r.totalConfidence+"%",r.link,
      new Date(r.ts).toLocaleString("pt-BR")
    ]);
    const csv=[h,...rows].map(row=>row.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}));
    a.download=(ST.meta?.query||"precos").replace(/\s+/g,"_")+".csv";
    a.click();toast("CSV baixado!");
  }else{
    const q=ST.meta?.query||ST.query;
    const s=ST.settings;
    const lines=[`🔍 *PriceIQ — ${q}*\n📅 ${new Date().toLocaleString("pt-BR")}\n`];
    if(s.usd>0)lines.push(`💱 Cotação: USD ${fmt4(s.usd)} · CNY ${fmt4(s.cny)} · EUR ${fmt4(s.eur)} · Fonte: ${s.rateSource||"Investing.com"}\n`);
    ST.results.forEach((r,i)=>{
      const m=["🥇","🥈","🥉"][i]||`${i+1}.`;
      lines.push(`${m} *${r.supplier}*`);
      lines.push(`   💰 R$ ${fmt(r.brl)} (${r.currency} ${fmt(r.price)})`);
      lines.push(`   🚚 ${r.freeShip?"Frete grátis ✅":r.freightNote==="não encontrado"?"Frete: conferir no site ⚠️":`Frete: ${r.currency} ${fmt(r.freight)}`}`);
      if(r.sellerName)lines.push(`   🏪 ${r.sellerName}`);
      if(r.productRating)lines.push(`   ⭐ ${r.productRating} (${r.productReviews} avaliações)`);
      lines.push(`   ${r.available?"✅ Disponível":"❌ Indisponível"}`);
      lines.push(`   🔗 ${r.link}\n`);
    });
    lines.push(`_via PriceIQ_`);
    const text=lines.join("\n");
    if(navigator.share){try{await navigator.share({title:`Preços: ${q}`,text});return}catch{}}
    try{await navigator.clipboard.writeText(text);toast("Copiado!");}
    catch{toast("Não foi possível copiar","err")}
  }
}

  const catalog=parseCatalogText(catalogRaw);
  const data={name,site,url,note:g("sf-note").trim(),type:g("sf-type"),country:g("sf-country"),cur:g("sf-cur"),on,
    supportsPublicSearch,requiresLogin,collectionMode:"agent",
    allowedMethods:allowedMethods.length?allowedMethods:DEFAULT_METHODS.slice(),
    catalog};
  if(ST.sfMode==="edit")ST.suppliers=ST.suppliers.map(s=>s.id===ST.sfId?{...s,...data}:s);
  else ST.suppliers=[...ST.suppliers,{...data,id:"sup"+Date.now()}];
  ST.sfMode=null;ST.sfId=null;ST.sfData=null;
  persist();toast("Salvo! "+catalog.length+" produto(s) no catálogo");renderSuppliers();
}
function cancelSupForm(){
  ST.sfMode=null;ST.sfId=null;ST.sfData=null;
  const area=document.getElementById("sup-form-area");
  if(area)area.innerHTML="";
}
function toggleSupOn(btn){
  const sid=btn.getAttribute("data-sid");
  ST.suppliers=ST.suppliers.map(s=>s.id===sid?{...s,on:!s.on}:s);
  persist();renderSuppliers();
}
function delSup(btn){
  const sid=btn.getAttribute("data-sid");
  ST.suppliers=ST.suppliers.filter(s=>s.id!==sid);
  persist();toast("Removido.");renderSuppliers();
}

// ══════════════════════════════════════════════════════
// HISTORY
// ══════════════════════════════════════════════════════
function renderHistory(){
  const items=ST.saved.map((rec,i)=>{
    const b=rec.results?.[0];
    return`
      <div class="card" style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px">
          <div style="flex:1;min-width:0">
            <p style="color:#E8F0FE;font-weight:700;font-size:16px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(rec.query)}</p>
            <p style="color:#4A5568;font-size:12px">${new Date(rec.ts).toLocaleString("pt-BR")} · ${rec.count} resultado${rec.count!==1?"s":""}</p>
          </div>
          ${b?`<div style="text-align:right;flex-shrink:0">
            <p style="color:#4A5568;font-size:10px;margin-bottom:2px">Melhor preço</p>
            <p style="color:#00D4FF;font-weight:800;font-size:17px">R$ ${fmt(b.brl)}</p>
            <p style="color:#4A5568;font-size:10px">${esc(b.supplier)}</p>
          </div>`:""}
        </div>
        ${rec.insight?.bestChoice?`<div style="background:rgba(255,184,0,.1);border:1px solid rgba(255,184,0,.3);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px"><span style="color:#FFB800;font-weight:700">${ico.trophy} Melhor opção: </span><span style="color:#8896AA">${esc(rec.insight.bestChoice)}</span></div>`:""}
        <div style="display:flex;gap:8px">
          <button class="btn btn-p" data-ridx="${i}" onclick="loadSaved(this)" style="flex:1">${ico.eye} Ver Resultados</button>
          <button class="btn btn-d btn-sm" data-ridx="${i}" onclick="delSaved(this)">${ico.trash}</button>
        </div>
      </div>`;
  }).join("");

  document.getElementById("page-history").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div>
        <h2 style="color:#E8F0FE;font-size:20px;font-weight:800;margin-bottom:3px">Histórico</h2>
        <p style="color:#4A5568;font-size:13px">${ST.saved.length} pesquisas salvas</p>
      </div>
      ${ST.saved.length?`<button class="btn btn-d btn-sm" onclick="clearSaved()">${ico.trash} Limpar</button>`:""}
    </div>
    ${ST.saved.length?items:`
      <div style="text-align:center;padding:60px 20px;background:#111827;border-radius:18px;border:1px solid #1C2A3A">
        <p style="color:#8896AA;font-size:16px;font-weight:700;margin-bottom:6px">Nenhuma pesquisa salva</p>
        <p style="color:#4A5568;font-size:14px">Faça uma busca e clique em Salvar.</p>
      </div>`}
  `;
}
function loadSaved(btn){
  const idx=parseInt(btn.getAttribute("data-ridx"));
  const rec=ST.saved[idx];
  if(!rec)return;
  ST.query=rec.query;ST.results=rec.results||[];ST.insight=rec.insight||null;ST.meta=rec;ST.expandId=null;
  nav("results");
}
function delSaved(btn){
  const idx=parseInt(btn.getAttribute("data-ridx"));
  ST.saved.splice(idx,1);persist();renderHistory();
}
function clearSaved(){ST.saved=[];persist();toast("Limpo.");renderHistory()}

// ══════════════════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════════════════
function renderSettings(){
  const s=ST.settings;
  const ex=50,tot=ex*s.usd+Number(s.freight),res=tot*(1+s.margin/100);
  const rateStale=s.rateTimestamp&&(Date.now()-s.rateTimestamp)>RATE_TTL;

  document.getElementById("page-settings").innerHTML=`
    <h2 style="color:#E8F0FE;font-size:20px;font-weight:800;margin-bottom:20px">Configurações</h2>
    <div style="display:flex;flex-direction:column;gap:14px">

      <!-- Cotação ao vivo -->
      <div class="card" style="border-color:rgba(0,212,255,.28)">
        <p style="color:#00D4FF;font-size:13px;font-weight:700;text-transform:uppercase;margin-bottom:14px;letter-spacing:.5px">💱 Cotação ao vivo — automática (1min)</p>
        <div class="g3" style="margin-bottom:14px">
          <div style="background:#070B14;border-radius:10px;padding:10px 12px">
            <p style="color:#4A5568;font-size:10px;margin-bottom:3px">USD/BRL</p>
            <p style="color:#00D4FF;font-weight:800;font-size:16px">R$ ${s.usd>0?fmt4(s.usd):"—"}</p>
            ${s.usdWarning?`<p style="color:#FFB800;font-size:10px;margin-top:3px">⚠️ ${esc(s.usdWarning)}</p>`:""}
          </div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px">
            <p style="color:#4A5568;font-size:10px;margin-bottom:3px">CNY/BRL</p>
            <p style="color:#00D4FF;font-weight:800;font-size:16px">R$ ${s.cny>0?fmt4(s.cny):"—"}</p>
            ${s.cnyWarning?`<p style="color:#FFB800;font-size:10px;margin-top:3px">⚠️ ${esc(s.cnyWarning)}</p>`:""}
          </div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px">
            <p style="color:#4A5568;font-size:10px;margin-bottom:3px">EUR/BRL</p>
            <p style="color:#00D4FF;font-weight:800;font-size:16px">R$ ${s.eur>0?fmt4(s.eur):"—"}</p>
            ${s.eurWarning?`<p style="color:#FFB800;font-size:10px;margin-top:3px">⚠️ ${esc(s.eurWarning)}</p>`:""}
          </div>
        </div>
        <p style="color:${rateStale?"#FFB800":"#4A5568"};font-size:12px;margin-bottom:12px">
          ${rateStale?"⚠️ Cotação desatualizada · ":""}Fonte: Investing.com · Última atualização: ${s.rateTime||"—"} (${rateAge()})
        </p>
        <button class="btn btn-p" onclick="refreshRatesSettings()">${ico.refresh} Atualizar cotação agora</button>
      </div>

      <!-- Frete & Margem -->
      <div class="card">
        <p style="color:#8896AA;font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:14px;letter-spacing:.5px">Frete & Margem</p>
        <div class="g2">
          <div>
            <label class="lbl">Frete padrão (R$)</label>
            <input id="set-frt" type="number" step="1" class="inp" value="${s.freight}"/>
            <p style="color:#4A5568;font-size:11px;margin-top:5px">Apenas simulação quando frete não encontrado</p>
          </div>
          <div>
            <label class="lbl">Margem de lucro (%)</label>
            <input id="set-mrg" type="number" step="1" class="inp" value="${s.margin}"/>
            <p style="color:#4A5568;font-size:11px;margin-top:5px">Para sugestão de revenda</p>
          </div>
        </div>
      </div>

      <!-- Simulação -->
      <div style="background:linear-gradient(135deg,rgba(0,212,255,.09),rgba(0,102,255,.05));border:1px solid rgba(0,212,255,.28);border-radius:16px;padding:18px">
        <p style="color:#00D4FF;font-size:13px;font-weight:700;margin-bottom:14px">🧮 Simulação: produto USD 50</p>
        <div class="g2">
          <div style="background:#070B14;border-radius:10px;padding:10px 12px"><p style="color:#4A5568;font-size:11px;margin-bottom:3px">USD 50 em BRL</p><p style="color:#E8F0FE;font-weight:700;font-size:15px">R$ ${fmt(ex*s.usd)}</p></div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px"><p style="color:#4A5568;font-size:11px;margin-bottom:3px">Frete padrão (sim.)</p><p style="color:#E8F0FE;font-weight:700;font-size:15px">R$ ${fmt(s.freight)}</p></div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px"><p style="color:#4A5568;font-size:11px;margin-bottom:3px">Total importado</p><p style="color:#E8F0FE;font-weight:700;font-size:15px">R$ ${fmt(tot)}</p></div>
          <div style="background:#070B14;border-radius:10px;padding:10px 12px"><p style="color:#4A5568;font-size:11px;margin-bottom:3px">Revenda (${s.margin}%)</p><p style="color:#00E5A0;font-weight:700;font-size:15px">R$ ${fmt(res)}</p></div>
        </div>
      </div>

      <button class="btn btn-p" onclick="saveSettings()">${ico.save} Salvar Configurações</button>
    </div>
  `;
}

async function refreshRatesSettings(){
  toast("Atualizando cotações…");
  const r=await fetchLiveRates(true);
  renderSettings();
  if(!r.fromCache&&!r.partial)
    toast(`Cotação atualizada: USD ${fmt4(ST.settings.usd)} · EUR ${fmt4(ST.settings.eur)} · CNY ${fmt4(ST.settings.cny)}`);
  else if(!r.fromCache&&r.partial)
    toast(`Atualização parcial: USD ${fmt4(ST.settings.usd)}`);
  else if(ST.settings.usd>0)
    toast(`Mantendo última cotação: USD ${fmt4(ST.settings.usd)}`);
  else toast("Sem cotação disponível","err");
}

function saveSettings(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:""};
  ST.settings={
    ...ST.settings,
    freight:parseFloat(g("set-frt"))||25,
    margin:parseFloat(g("set-mrg"))||30,
  };
  persist();
  toast("Configurações salvas!");
  updateNavRateSub();
  renderSettings();
}

// ══════════════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════════════
renderHome();
// Busca cotação em background ao abrir o app
fetchLiveRates().then(()=>{
  updateNavRateSub();
  if(ST.view==="home")renderHome();
  if(ST.view==="settings")renderSettings();
}).catch(()=>{});
// Auto-refresh de cotação a cada 1 minuto
setInterval(()=>{
  fetchLiveRates(true).then(()=>{
    updateNavRateSub();
    if(ST.view==="home")renderHome();
    if(ST.view==="settings")renderSettings();
  }).catch(()=>{});
},RATE_TTL);
</script>
</body>
</html>
