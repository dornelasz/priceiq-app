# Render Blueprint — backend oficial do PriceIQ (Fastify).
#
# Stack oficial: Render (backend) + Supabase Postgres (banco) + Vercel (frontend)
# + Firecrawl (coletor, via backend Render).
#
# Uso OPCIONAL: no Render, "New +" → "Blueprint" apontando para este repo cria
# o Web Service automaticamente. Em deploy MANUAL (New + → Web Service) este
# arquivo é ignorado, então ele não quebra nada — os comandos abaixo são os
# mesmos que você digitaria na mão.
#
# NÃO contém secrets. DATABASE_URL, FRONTEND_URL, CORS_ORIGIN, REDIS_URL e
# FIRECRAWL_API_KEY usam `sync: false` → o Render pede o valor no dashboard e
# nunca o grava neste arquivo/repo.
#
# Importante: o build usa `--include=dev` porque, com NODE_ENV=production, o
# `npm install` puro omite devDependencies (typescript/tsx) e o build/migração
# falhariam.
#
# Migrações: no plano Free, rodam no startCommand (idempotentes — só aplicam o
# que falta). Em planos pagos (Starter+) você pode mover para um Pre-deploy
# Command separado (`npm run db:migrate`) e deixar startCommand = `npm run start`.
services:
  - type: web
    name: priceiq-server
    runtime: node
    rootDir: server
    plan: free # Free hiberna após inatividade. Pre-deploy command exige Starter+.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Render injeta PORT (default 10000); declarado aqui para deixar explícito.
      - key: PORT
        value: "10000"
      # Prefere IPv4 na resolução DNS — evita falhas de conexão ao pooler Supabase.
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      # Estratégia catalog-first ligada (Etapa 18).
      - key: CATALOG_SEARCH_ENABLED
        value: "true"
      # Postgres do Supabase (Pooler, porta 6543). Secret → preenchido no dashboard.
      - key: DATABASE_URL
        sync: false
      # URL pública do frontend (Vercel), sem barra final.
      - key: FRONTEND_URL
        sync: false
      # Opcional: origens CSV; tem precedência sobre FRONTEND_URL.
      - key: CORS_ORIGIN
        sync: false
      # Cache opcional; ausente → cai para memória.
      - key: REDIS_URL
        sync: false
      # ─── Firecrawl (LIGADO na stack oficial) ───
      - key: FIRECRAWL_ENABLED
        value: "true"
      # Obrigatória com FIRECRAWL_ENABLED=true. Secret → dashboard (fc-...).
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FIRECRAWL_API_URL
        value: https://api.firecrawl.dev/v2
      - key: FETCH_PROVIDER_PRIORITY
        value: firecrawl,native
