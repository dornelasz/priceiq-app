name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare offline shell for Capacitor
        # O APK abre `capacitor.config.json -> server.url` (URL da Vercel)
        # como WebView remoto. O `www/` é EXIGIDO pelo Capacitor como
        # fallback offline — gravamos aqui um shell mínimo que NUNCA é o
        # `index.html` legado. Se a Internet falhar antes da URL remota
        # carregar, o usuário vê apenas uma tela de "Carregando".
        run: |
          mkdir -p www
          cat > www/index.html << 'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>PriceIQ</title>
            <style>
              body {
                font-family: system-ui, -apple-system, sans-serif;
                background: #0B0F17;
                color: #fff;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                text-align: center;
                padding: 24px;
                box-sizing: border-box;
              }
              h1 { font-size: 24px; margin: 0 0 12px; }
              p  { color: #8896AA; font-size: 14px; margin: 4px 0; }
            </style>
          </head>
          <body>
            <h1>PriceIQ</h1>
            <p>Carregando…</p>
            <p>Verifique sua conexão com a Internet caso esta tela permaneça.</p>
          </body>
          </html>
          HTML

          if [ ! -f www/index.html ]; then
            echo "ERRO: shell offline www/index.html não foi gerado"
            ls -la
            ls -la www || true
            exit 1
          fi
          echo "✓ Shell offline gerado em www/index.html ($(wc -c < www/index.html) bytes)"
          echo "✓ APK abrirá server.url do capacitor.config.json em runtime."

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PriceIQ-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
