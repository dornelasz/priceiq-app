name: web-ci

# CI do frontend Next.js — roda em PR/push que mexa em web/.
on:
  push:
    branches: [main, saas-migration]
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ci.yml'

jobs:
  typecheck-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # CI build não precisa do backend rodando — apenas valida que
          # tudo compila. Em deploy real, NEXT_PUBLIC_API_URL aponta para
          # a URL pública do server.
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: npm run build
